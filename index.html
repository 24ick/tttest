<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>適性検査 問題検索</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
:root{
  --key:#0017c1; --key-hover:#00118f; --key-active:#000060;
  --key-bg:#e8f1fe; --key-bg-hover:#d9e6ff;
  --text:#1a1a1a; --text-sub:#4d4d4d; --border:#949494; --border-weak:#cccccc;
  --bg:#ffffff; --bg-sub:#f2f2f2; --error:#ec0000; --focus:#ffd43d;
  --hl-bg:#d9f5fa; --hl-border:#00899f;
  --font:'Noto Sans JP',-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --key:#7b8cff;--key-hover:#9aa7ff;--key-active:#b6bfff;--key-bg:#16204f;--key-bg-hover:#1f2c6b;
    --text:#f2f2f2;--text-sub:#c4c4c4;--border:#8c8c8c;--border-weak:#4d4d4d;--bg:#121212;--bg-sub:#1f1f1f;
    --error:#ff7b79;--hl-bg:#073a44;--hl-border:#4fd0e6;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --key:#7b8cff;--key-hover:#9aa7ff;--key-active:#b6bfff;--key-bg:#16204f;--key-bg-hover:#1f2c6b;
  --text:#f2f2f2;--text-sub:#c4c4c4;--border:#8c8c8c;--border-weak:#4d4d4d;--bg:#121212;--bg-sub:#1f1f1f;
  --error:#ff7b79;--hl-bg:#073a44;--hl-border:#4fd0e6;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:1rem;line-height:1.7;letter-spacing:.02em;}
:focus-visible{outline:4px solid #000;outline-offset:2px;box-shadow:0 0 0 2px var(--focus)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :focus-visible{outline-color:#fff}}
:root[data-theme="dark"] :focus-visible{outline-color:#fff}
.skip{position:absolute;left:-9999px;top:0;background:var(--bg);padding:8px 16px;z-index:20}
.skip:focus{left:8px;top:8px}
.wrap{max-width:800px;margin:0 auto;padding:0 16px}
header.site{border-bottom:1px solid var(--border-weak);padding:24px 0 16px}
h1{font-size:1.75rem;line-height:1.5;margin:0 0 8px;font-weight:700;letter-spacing:.01em}
.lead{margin:0;color:var(--text-sub)}
main{padding:24px 0 80px}
label.fl{display:block;font-size:1.0625rem;font-weight:700;line-height:1.7;margin-bottom:4px}
.support{color:var(--text-sub);margin:0 0 8px;font-size:1rem}
.sb{display:flex;gap:8px}
.sb input{flex:1;min-width:0;min-height:56px;padding:8px 16px;font:inherit;font-size:1.0625rem;
  color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;letter-spacing:.02em}
.sb input::placeholder{color:var(--text-sub)}
.btn{min-height:48px;padding:12px 20px;font:inherit;font-weight:700;line-height:1;border-radius:8px;
  cursor:pointer;border:1px solid var(--key);letter-spacing:.02em;white-space:nowrap}
.btn.outline{background:var(--bg);color:var(--key)}
.btn.outline:hover{background:var(--key-bg);color:var(--key-hover);border-color:var(--key-hover);text-decoration:underline}
.btn.outline:active{background:var(--key-bg-hover);color:var(--key-active);border-color:var(--key-active)}
.btn.fill{background:var(--key);color:#fff;width:100%;margin-top:24px}
.btn.fill:hover{background:var(--key-hover);text-decoration:underline}
.btn.fill:active{background:var(--key-active)}
.btn.text{border-color:transparent;background:none;color:var(--key);text-decoration:underline;min-height:44px;padding:8px}
.btn.text:hover{background:var(--key-bg);color:var(--key-hover)}
#status{margin:16px 0 8px;font-weight:700}
details.disc{margin-top:8px;border-top:1px solid var(--border-weak);border-bottom:1px solid var(--border-weak)}
details.disc summary{cursor:pointer;min-height:56px;display:flex;align-items:center;gap:8px;
  padding:8px 4px;font-weight:700;font-size:1.0625rem;list-style:none}
details.disc summary::-webkit-details-marker{display:none}
details.disc summary::before{content:"";width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(-45deg);transition:transform .15s;margin:0 6px 0 4px}
details.disc[open] summary::before{transform:rotate(45deg)}
details.disc summary:hover{background:var(--bg-sub);text-decoration:underline}
.badge{background:var(--key);color:#fff;border-radius:999px;padding:2px 10px;font-size:.875rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 4px 16px}
.chip{min-height:44px;padding:8px 16px;font:inherit;font-size:1rem;line-height:1.4;color:var(--text);background:var(--bg);
  border:1px solid var(--border);border-radius:999px;cursor:pointer}
.chip:hover{background:var(--key-bg)}
.chip[aria-pressed="true"]{background:var(--key);color:#fff;border-color:var(--key);font-weight:700}
.chip small{font-size:.875rem;opacity:.85}
.card{border:1px solid var(--border-weak);border-radius:12px;padding:16px;margin:0 0 16px;background:var(--bg)}
.labels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.label{font-size:.875rem;line-height:1.5;padding:2px 10px;border-radius:6px;background:var(--key-bg);color:var(--key-hover);border:1px solid var(--key)}
.label.cat{background:var(--bg-sub);color:var(--text);border-color:var(--border)}
.q{margin:0 0 8px;font-size:1.0625rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.subq{margin:0 0 12px;padding:8px 12px;border-left:4px solid var(--border);background:var(--bg-sub);white-space:pre-wrap;word-break:break-word}
.ans{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--border-weak);padding-top:12px}
.ans b.k{flex:none;background:var(--key);color:#fff;border-radius:6px;padding:2px 10px;font-size:.875rem;line-height:1.7}
.ans .v{font-size:1.0625rem;font-weight:700;white-space:pre-wrap;word-break:break-word;line-height:1.7}
mark{background:var(--hl-bg);color:inherit;border-bottom:2px solid var(--hl-border);padding:0 1px}
.empty{border:1px solid var(--border-weak);border-radius:8px;padding:24px 16px;background:var(--bg-sub)}
.empty p{margin:0}
.err{border:2px solid var(--error);border-radius:8px;padding:12px 16px;margin:16px 0;font-weight:700}
footer.site{border-top:1px solid var(--border-weak);padding:16px 0 32px;color:var(--text-sub);font-size:.875rem}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;background:var(--bg)}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<header class="site"><div class="wrap">
  <h1>適性検査 問題検索</h1>
  <p class="lead">問題文の冒頭を入力すると、該当する問題と答えを表示します。</p>
</div></header>
<main id="main"><div class="wrap">
  <section aria-labelledby="sl">
    <label class="fl" for="q" id="sl">問題文の冒頭</label>
    <p class="support" id="sh">例：「益鳥」「P,Q,R,S」など、最初の数文字で検索できます。</p>
    <div class="sb">
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-describedby="sh" placeholder="キーワードを入力">
      <button class="btn outline" id="clr" type="button">クリア</button>
    </div>
    <details class="disc" id="fd">
      <summary>種類で絞り込み <span class="badge" id="fb" hidden></span></summary>
      <div class="chips" id="chips" role="group" aria-label="問題の種類"></div>
      <button class="btn text" id="fclr" type="button">絞り込みを解除</button>
    </details>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="res" aria-label="検索結果"></section>
  <button class="btn fill" id="more" type="button" hidden>さらに表示</button>
</div></main>
<footer class="site"><div class="wrap">アップロードされたExcelから自動抽出・重複除去済み（全<span id="total"></span>件）</div></footer>
<button class="btn outline" id="top" type="button" aria-label="ページ上部へ戻る">↑ 上へ</button>

が120個ある。これらをあまりなく使って同じ内容の詰め合わせをいくつか作りたい。詰め合わせに入れるそれぞれの石けんの数について,以下の条件がある アハチミツ入り石けんは8個以内にする イハーブ入り石けんは10個以上にする このとき,詰め合わせは セットできる。", "sub": "", "answer": "12", "id": 3907}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,R,Sの4人で35個のミカンを分けた。だれが何個もらったかについて,以下のことがわかっている。ただし,1個ももらわなかった人はいなかったものとする。 アPとQは同じ個数で,Rより多い イSはQの1.5倍の個数である。 このとき,Sがもらったミカンは 個である", "sub": "", "answer": "12", "id": 3908}, {"sheet": "SPI(非言語)", "category": "", "question": "ある品物に仕入れ値の50％増しの定価をつけたが,セール期間中は割引き価格で売ったところ,仕入れ値の5%の利益が得られた。セール期間中は定価の ％引きで売ったことになる", "sub": "", "answer": "30", "id": 3909}, {"sheet": "SPI(非言語)", "category": "", "question": "あるサークルには男性47人、女性68人のメンバーがいる。合宿の参加者は男女どちらが多いか？ ア男性のうち8人が合宿に参加しなかった。イ女性のうち19人が合宿に参加しなかった。", "sub": "", "answer": "イだけでわかる", "id": 3910}, {"sheet": "SPI(非言語)", "category": "", "question": "1鉢200円、350円、500円の花を合わせて3200円購入した。全部で何鉢買ったか？ア200円の花は5鉢買った。イ500円の花は3鉢買った", "sub": "", "answer": "アだけでもイだけでもわかる", "id": 3911}, {"sheet": "SPI(非言語)", "category": "", "question": "男子6人、女子4人の児童を5人ずつ赤組と白組に分ける。両方の男女比が等しくなるようにするとき、誰がどの組になるかの組み合わせは？", "sub": "", "answer": "120通り", "id": 3912}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】店頭に麦わら帽子が3個並べてある。1個売れるたびに倉庫から帽子を1個出して並べるとすると、3回目に倉庫から出した帽子を並べたところで、最初に店頭にあった3個のうち1個でも残っている確率", "sub": "", "answer": "7/9", "id": 3913}, {"sheet": "SPI(非言語)", "category": "", "question": "平成10年の利用者で「一般」は「シニア」の何倍か？", "sub": "", "answer": "1.36倍", "id": 3914}, {"sheet": "SPI(非言語)", "category": "", "question": "次のア、イ、ウのうち正しいのは？ア平成20年の総利用者数に閉める「シニア」の割合は50%以上である。イ平成20年の総利用者は、平成10年の総利用者数の75％以下である。ウ平成20年の総利用者で、平成15年に対する減少率が最も大きいのは「子供」である", "sub": "", "answer": "アイ両方", "id": 3915}, {"sheet": "SPI(非言語)", "category": "", "question": "部屋1の合計利用回数は部屋2の何倍であるか", "sub": "", "answer": "1.25倍", "id": 3916}, {"sheet": "SPI(非言語)", "category": "", "question": "アイウどれか？ア部屋1の利用回数に占める夜間の利用回数の割合は40％以上である。イ夜間の利用回数に占める部屋2の利用回数の割合は40％である。ウ2つの部屋を合わせた午前の栄養回数は、午後の利用回数の1.4倍以上である", "sub": "", "answer": "アとイ両方", "id": 3917}, {"sheet": "SPI(非言語)", "category": "", "question": "あるスーパーマーケットで来店者の購入状況を調べたところ、「日用雑貨」は55％、「衣料品」は27％の人が購入していた。「日用雑貨」か「衣料品」のいずれかだけの人は38％であるとすると、どちらも買ってない人は何％？", "sub": "", "answer": "0.4", "id": 3918}, {"sheet": "SPI(非言語)", "category": "", "question": "大学生350人に講義X、Yの履修状況を尋ねた。講義Xの履修者と講義X,Yのどちらも履修していない人の比率が3：1で、講義X、Yを共に履修している人は、講義Yのみを履修している人の半数だった。講義X、Yの少なくとも一方は履修している人が287人の時、講義Yのみを履修しているのは何人？", "sub": "", "answer": "98人", "id": 3919}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rの3人で友人のお祝いをすることになり、Pが食事代の9600円を、Qがプレゼント代を支払った。食事代とプレゼントを3等分することにし、RがPに3800円、Qにもいくらか支払って精算した。プレゼント代の総額は？", "sub": "", "answer": "7800円", "id": 3920}, {"sheet": "SPI(非言語)", "category": "", "question": "商品Pを定価の40％、引きで売って、仕入れの8％にあたる360円の利益を得た。この時商品Pの定価は？", "sub": "", "answer": "8100円", "id": 3921}, {"sheet": "SPI(非言語)", "category": "", "question": "模造紙を使ってポスターを作る。その誌面の2/5をタイトルに、残りの誌面の1/3を日時にあてたい。この時、日時にあてる誌面はタイトルにあてる紙面の何倍の大きさであるか？", "sub": "", "answer": "0.5倍", "id": 3922}, {"sheet": "SPI(非言語)", "category": "", "question": "ある会社の創立記念パーティーで、式典に参加したのは85人、懇談会に参加した人は70人だった。式典にだけ参加した人数が、懇談会にだけ参加した人数の2倍だった時、両方参加したのは？", "sub": "", "answer": "55人", "id": 3923}, {"sheet": "SPI(非言語)", "category": "", "question": "都道府県立図書館と市区町村立図書館を合わせると、コンピューターを設置している図書館のうち、来館者がインターネットを利用できるのは何％である", "sub": "", "answer": "0.64", "id": 3924}, {"sheet": "SPI(非言語)", "category": "", "question": "アイウのう都道府県立の45倍以上ち正しいのは？ア市区町村立図書館は全部で3150館以上ある。イ来館者がコンピューターを利用できるが、インターネットを利用できないのは、874館である。ウ来館者がコンピューターを利用できる関数について、市区町村立は", "sub": "", "answer": "f.イとウの両方", "id": 3925}, {"sheet": "SPI(非言語)", "category": "", "question": "飼料Pと飼料Qを1：３の割合で混ぜたものと、2：3で混ぜたものを同量ずつ取って混ぜると、この飼料に含まれる飼料Pno割合は何％？", "sub": "", "answer": "32.5％", "id": 3926}, {"sheet": "SPI(非言語)", "category": "", "question": "長いすに4人ずつ座ると4人が座れなくなる。5人ずつ座ると最後の長いすには4人が座ることになり、長いすが5個あまる。このとき長いすは何個", "sub": "", "answer": "30脚", "id": 3927}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】東西2地区合同でバスツアーを行ったところ、2地区合わせて68人が参加した。参加した大人と子供の人数について、以下のことが分かっている。ア西地区からの参加者のうち1/3が子供だった。イ東地区からの参加者数と西地区からの参加者の差は8人だった。このとき西地区から参加した大人の人数は", "sub": "", "answer": "20人", "id": 3928}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rの３本の果樹があり、Pには実が49個なった。3本の果樹のみの個数について以下のことが分かっている。アPとQの差はQとRの差に等しくそれぞれ戸数は異なっていた。Q3本を平均すると実は42個なった。このときRになった実は何個", "sub": "", "answer": "35個", "id": 3929}, {"sheet": "SPI(非言語)", "category": "", "question": "1回の受講料が1800円の講習Xと、2500円の講習Yを合わせて10回受けた。ただしどちらも少なくとも一回は受けた。受講料は合計いくらか。ア講習Xの受講料は10000円以上である。イ講習Yの受講料は5000円以下である。", "sub": "", "answer": "両方あってもわからない", "id": 3930}, {"sheet": "SPI(非言語)", "category": "", "question": "1回の受講料が1800円の講習Xと、2500円の講習Yを合わせて10回受けた。ただしどちらも少なくとも一回は受けた。受講料は合計いくらか。ア講習Xの受講料は15000円以上である。イ講習Yの受講料は5000円以下である。", "sub": "", "answer": "アだけでわかるがイだけではわからない", "id": 3931}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rは１から９までの整数のいずれかで、P+Q＝１５、P+R＝１４となる。P,Q,Rは", "sub": "", "answer": "両方あってもわからない", "id": 3932}, {"sheet": "SPI(非言語)", "category": "", "question": "横一列に並んだ5つの席があり、P,Q,R,S,T,の5人がくじ引きで座る席を決める。このとき、PとQが隣り合わせになる確率は?", "sub": "", "answer": "2/5", "id": 3933}, {"sheet": "SPI(非言語)", "category": "", "question": "、女性3人で8人乗りのワゴン車に乗る。全員が自動車を運転でき、運転席を含む席をくじで決めるとき、運転席を助手席に座る2人の性別が異なる確率は？", "sub": "", "answer": "15/28", "id": 3934}, {"sheet": "SPI(非言語)", "category": "", "question": "今年のP社への出荷数は、おととしの何倍か", "sub": "", "answer": "2.1倍", "id": 3935}, {"sheet": "SPI(非言語)", "category": "", "question": "次のア、イ、ウで正しいものはどれか。ア今年の出荷数は昨年より15％以上増加した。イQ社への昨年の出荷数は、おととしより減少した。ウ3年ともR社への出荷数はP社への出荷数の1/5以下だった", "sub": "", "answer": "アだけ", "id": 3936}, {"sheet": "SPI(非言語)", "category": "", "question": "ある部屋に9人の社員がおり、平均年齢が36.0歳である。新たに1人が配属されて平均年齢が35.2歳になったとすると、新たに配属された社員は何歳か", "sub": "", "answer": "28歳", "id": 3937}, {"sheet": "SPI(非言語)", "category": "", "question": "Xは900円、Yは700円持っている。XとYが同じ本をそれぞれ一冊買ったところ、Xの残金はYの残金の3倍となった。このとき買った本の代金は", "sub": "", "answer": "600円", "id": 3938}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zの3人がサイコロを振った。3人が出した目について、以下のことが分かっている。アXが出した目はYと同じである、イ3人が出した目の積は12である。", "sub": "", "answer": "３", "id": 3939}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rは正の整数である。アP× Q×R＝24 イP-Q=4 この時Rは？", "sub": "", "answer": "2", "id": 3940}, {"sheet": "SPI(非言語)", "category": "", "question": "の6人は小学生で、それぞれ学年は異なっている。6人の学年について以下のことが分かっている。アPは2年生である。イQはRより3学年、SはTより4学年上である。このときUは何年生", "sub": "", "answer": "4年生", "id": 3941}, {"sheet": "SPI(非言語)", "category": "", "question": "家から2.4km離れた図書まで50m/分の速さで歩くと、待ち合わせの時刻に18分遅れる。このとき、ちょうど待ち合わせの時刻に着く速さは？", "sub": "", "answer": "80m/分", "id": 3942}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品は1個375円、2個組600円で売られている。2個組の場合、1個当たりの割引率何パーセントか", "sub": "", "answer": "20％", "id": 3943}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品を定価の20％引きで売ったところ、仕入れ値の12％の利益が得られた。\n［問い］この商品の定価はいくらか。\nア 定価で売ると、180円の利益が得られる\nイ 定価の30％引きで売ると、9円の損失になる。", "sub": "", "answer": "アだけでもイだけでもわかる", "id": 3944}, {"sheet": "SPI(非言語)", "category": "", "question": "1mのひもを切って、長さの異なる４本のひもP,Q,R,Sを作った。Sは25cmである。このときQとSどちらが長いか。アPはQより長いイQはRより長い", "sub": "", "answer": "両方あってもわからない", "id": 3945}, {"sheet": "SPI(非言語)", "category": "", "question": "1,2,3,4の4枚のカードの中から2枚を使って2けたの整数を1つ作った。子の整数はいくつか。ア17で割り切れる。イ15で割ると4あまる。", "sub": "", "answer": "アだけでもイだけでもわかる", "id": 3946}, {"sheet": "SPI(非言語)", "category": "", "question": "56個入りの菓子袋を買い，その日に全体の2/7を，次の日に残りの1/4を食べた．残っているお菓子は？", "sub": "", "answer": "30", "id": 3947}, {"sheet": "SPI(非言語)", "category": "", "question": "P:25歳でQの年齢の5/7である．PはQよりも何歳若い？", "sub": "", "answer": "10", "id": 3948}, {"sheet": "SPI(非言語)", "category": "", "question": "Pは全体の3/4が60歳以上，Qは全体の3/5が60歳以上．両クラスとも60未満が10人のとき，PはQより何人多い？", "sub": "", "answer": "15", "id": 3949}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,R,Sの4人．Pは1位か2位，Qは3か4位，考えられる組み合わせは何通り？", "sub": "", "answer": "8", "id": 3950}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】東西2地区合同でバスツアーを行ったところ、、2地区合わせて75人参加．大人と子供の差は9,子供は東が西より5人多い．東地区の子供の人数は？", "sub": "", "answer": "19", "id": 3951}, {"sheet": "SPI(非言語)", "category": "", "question": "の6人．PはQの二人後ろ，RはSより2人後ろ，TはUより3人後ろ．Uは前から何番目？", "sub": "", "answer": "2", "id": 3952}, {"sheet": "SPI(非言語)", "category": "", "question": "1房に8本のバナナを70円で20房仕入れた．1房160円，1本30円で売り，全て売り切れ2680円の利益．房単位で売れたバナナは？", "sub": "", "answer": "9", "id": 3953}, {"sheet": "SPI(非言語)", "category": "", "question": "家から駅まで6.3km/時で走った．4.2km/時で歩いた時より3分早かった．家から駅までの道のりは何km？", "sub": "", "answer": "0.63", "id": 3954}, {"sheet": "SPI(非言語)", "category": "", "question": "ある選挙でXへの投票は全体の52%.そのうちの65%は60歳以上．Xに投票した60未満の人は全体の何%？", "sub": "", "answer": "18.2", "id": 3955}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品を定価の20%引き．ア：54円の利益 イ：定価で売った時と比べ，126円利益が減った．定価はいくらか？", "sub": "", "answer": "イだけで分かる", "id": 3956}, {"sheet": "SPI(非言語)", "category": "", "question": "あるサークルには男性56人，女性75人のメンバーがいる。ア:男性の25%が合宿に参加しなかった イ:女性の20%が合宿に参加しなかった 参加者は男女どちらが多かったか？", "sub": "", "answer": "イだけで分かる", "id": 3957}, {"sheet": "SPI(非言語)", "category": "", "question": "100枚のチケットを4人で買い取った．各々枚数は異なり，Sは35枚．ア:P>Q イ:R>Q．QとSどちらが多いか？", "sub": "", "answer": "アだけでもイだけでも\nメモ: 類似注意", "id": 3958}, {"sheet": "SPI(非言語)", "category": "", "question": "1組のトランプ絵札12枚を2枚取り出す．スペードが1枚だけある確率は？", "sub": "", "answer": "9/22", "id": 3959}, {"sheet": "SPI(非言語)", "category": "", "question": "都道府県立と市区町村立合わせて，設置している図書館のうち，来館者がインターネットを利用できるのは何%？", "sub": "", "answer": "64", "id": 3960}, {"sheet": "SPI(非言語)", "category": "", "question": "ア:市区町村立図書館は3150館以上, イ:コンピュータ利用可かつインターネット利用不可は合計874館，ウ:コンピュータ利用可について，市区町村立は都道府県立の45倍以上", "sub": "", "answer": "イとウ", "id": 3961}, {"sheet": "SPI(非言語)", "category": "", "question": "ある団体旅行の参加者260人のうち，テーマ60%,クルー35%,両方10%．どちらか一方だけ選んだ人は何人？", "sub": "", "answer": "195", "id": 3962}, {"sheet": "SPI(非言語)", "category": "", "question": "縦1.2m,横1.5mの長方形の菜園がある．その3/8でなすを，残りの2/5できゅうり．なすはきゅうりの面積の何倍？", "sub": "", "answer": "1.5", "id": 3963}, {"sheet": "SPI(非言語)", "category": "", "question": "ケーキを6等分するはずが、間違えて8等分してしまった。6等分した時に比べ，何%小さくなった？", "sub": "", "answer": "0.25", "id": 3964}, {"sheet": "SPI(非言語)", "category": "", "question": "40歳代の父親と9際の子供の親子がいる。父親の年齢はいくつか。\nア現在、父親の年齢は３の倍数である。\nイ4年後に父親の年齢は、子どもの年齢の倍数になる。", "sub": "", "answer": "B", "id": 3965}, {"sheet": "SPI(非言語)", "category": "", "question": "240㎞先の目的地まで車で走ったところ、途中のX地点までの平均時速は40㎞/時、X地点から目的地までの平均時速は60㎞/時だった。X地点では1時間休憩した。\n\nア 目的地に到達するまでに5時間かかった。\nイ X地点までの距離は目的地までの距離の半分だった。", "sub": "", "answer": "D", "id": 3966}, {"sheet": "SPI(非言語)", "category": "", "question": "3人の男性P,Q,Rが1,2,3,女性X,Y,Zが4,5,6円卓に座っている．P&X,Q&Y,R&Zは夫婦．ア:両隣に女性はRのみ,イ:ＱとYが真向い，Ｐの向かいは？", "sub": "", "answer": "3", "id": 3967}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品を25個，仕入れ値の40%で売る．売れ残りが出て，1個当たりの利益は仕入れ値の12%．売れた個数は？", "sub": "", "answer": "20", "id": 3968}, {"sheet": "SPI(非言語)", "category": "", "question": "【疑似注意】家から図書館に向かう。60m/分だと5分遅れる。210m/分だと20分早い。家から図書館までの距離は何km？", "sub": "", "answer": "2.1", "id": 3969}, {"sheet": "SPI(非言語)", "category": "", "question": "【疑似注意】家から図書館に向かう。60m/分だと5分遅れる。210m/分だと20分早い。このとき、待ち合わせの時刻は今から何分後？", "sub": "", "answer": "30", "id": 3970}, {"sheet": "SPI(非言語)", "category": "", "question": "(類似注意)4cm×6cmの長方形のタイルが正方形の枠内に同じ向きに隙間なく並べて貼られている。 ア：縦の枚数は横の枚数の1.5倍である イ:縦、横のいずれかの枚数は12枚である タイルの枚数は何枚か。", "sub": "", "answer": "ア×イ×", "id": 3971}, {"sheet": "SPI(非言語)", "category": "", "question": "PとQが貯金の半分を出した．A:Pの貯金は500万, B:Qの貯金=車の代金． Pが出した金額は代金のどれだけか？", "sub": "", "answer": "ア×イ〇", "id": 3972}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rの3人が出した目の合計は13．A:PはQの2倍，B:PはRより2大きい． Pが出した目はいくつか？", "sub": "", "answer": "ア〇イ×", "id": 3973}, {"sheet": "SPI(非言語)", "category": "", "question": "5種類ある花から3種類ずつ組み合わせて花束2つ作る．どの種類も少なくとも1回は使う場合，花束の組み合わせは？", "sub": "", "answer": "30", "id": 3974}, {"sheet": "SPI(非言語)", "category": "", "question": "10枚の封筒はあり，そのうちの1枚には10000が、2枚には5000円が入っており、残りの7枚は空である．２枚選ぶとき，10000円になる確率は？", "sub": "", "answer": "8/45", "id": 3975}, {"sheet": "SPI(非言語)", "category": "", "question": "国立，公立，私立，の中で学生のうち社会人の割合が最も大きいものは何%?", "sub": "", "answer": "0.19", "id": 3976}, {"sheet": "SPI(非言語)", "category": "", "question": "ア:国立大学院の社会人でない学生は86000人以下，イ:全大学院合計で，男子学生数は女性の2倍以上， ウ:私立の学生を男女別に見た時．学生のうち社会人の占める割合は男＜女 ": "SPI(非言語)", "category": "", "question": "10kgの米をX ,Y、Zの3人で分けた。Zは何kgもらった？ア XはYより3kg多くもらった イ XはYの4倍の量をもらった", "sub": "", "answer": "Bイだけでわかる", "id": 4108}, {"sheet": "SPI(非言語)", "category": "", "question": "2本のあたりくじが入った7本のくじがある。5人が順にくじを引き、一度引いたくじは戻さないものとすると、5人ともあたりくじを引かない確率は？約分した分数", "sub": "", "answer": "1/21", "id": 4109}, {"sheet": "SPI(非言語)", "category": "", "question": "種類の異なるチョコレートが7つあり、それらをP、Qの2人で分ける。Pは3つ、Qは4つもらうとすると、チョコレートの分け方は何通り？", "sub": "", "answer": "35通り", "id": 4110}, {"sheet": "SPI(非言語)", "category": "", "question": "ある中学で虫歯のある生徒数を調べ、10年前と比較。1. 今年、全校生徒に占める虫歯のある生徒の割合は何％？（小数点以下第1位四捨五入） 2. 学年ごとに虫歯のある生徒の割合を10年前と比較。減少幅の大きい順に各学年を並べたものはどれか。", "sub": "", "answer": "1. 68% 2. 1年生、3年生、2年生", "id": 4111}, {"sheet": "SPI(非言語)", "category": "", "question": "100世帯が入居しているあるマンションで、マンション内の駐車場を利用している世帯は25世帯、駐輪場を利用している世帯は70世帯、どちらも利用していない世帯は１８世帯。このとき、駐車場と駐輪場の両方を利用している世帯は何世帯？", "sub": "", "answer": "13世帯", "id": 4112}, {"sheet": "SPI(非言語)", "category": "", "question": "ある喫茶店では、40人の客のうち、紅茶を注文した客は17人、ケーキを注文した客は21人、どちらも注文しなかった客は13人いた。このとき、紅茶とケーキの両方を注文した客は何人？", "sub": "", "answer": "11人", "id": 4113}, {"sheet": "SPI(非言語)", "category": "", "question": "行うと、10人で行う場合に比べて1人あたりの入力件数が160件増える。このとき、入力するデータの件数は全部で何件？", "sub": "", "answer": "6400件", "id": 4114}, {"sheet": "SPI(非言語)", "category": "", "question": "みかん12個とりんご8個がある。XとYはみかんとりんごをそれぞれ1個以上もらい、合計10個ずつになるように分けた。ア Xがもらったみかんの個数は奇数だった。イ Yがもらったみかんの個数はりんごの個数より少なかった。Xがもらったみかんは何個？", "sub": "", "answer": "9個", "id": 4115}, {"sheet": "SPI(非言語)", "category": "", "question": "ある店のコーヒーは大きさによって値段が異なる。LサイズとMサイズを一つずつ買うと770円で、MサイズとSサイズを2つずつ買うと1360円であるとき、LサイズはSサイズより[ ]円高い。", "sub": "", "answer": "90円", "id": 4116}, {"sheet": "SPI(非言語)", "category": "", "question": "ある製品の販売価格を調べたところ、P町にある9店舗の平均価格は1028円、Q町にある15店舗の平均価格は948円だった。P町とQ町を合わせた24店舗の平均価格は?", "sub": "", "answer": "978円", "id": 4117}, {"sheet": "SPI(非言語)", "category": "", "question": "35人の子どもが、りんごとみかんの入った箱の中から好きなものを2個もらえることになった。りんごを少なくとも1個もらった人は28人いた。また、箱の中から減った", "sub": "", "answer": "8個", "id": 4118}, {"sheet": "SPI(非言語)", "category": "", "question": "ある仕事をX、Y、Zの3人で分担した。Xは全体の2/7を、YはXの1.8倍の量を分担した。このとき、Zの仕事量はXの何倍か", "sub": "", "answer": "0.7倍", "id": 4119}, {"sheet": "SPI(非言語)", "category": "", "question": "P、Q、R、S、Tの5つのテレビ番組の視聴率を調査し順位をつけた。この5つの番組の先週と今週の順位について、以下のことが分かっている。ア 先週1位だったPは、今週は3位だった。イ Q、R、Sは先週より1つずつ順位が上がった。先週、今週ともに同順位の番組はなかったとすると、先週のTの順位は何位?", "sub": "", "answer": "4位", "id": 4120}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人が家庭菜園でトマトを栽培している。一昨日、昨日、今日の3日間で合計20個のトマトを収穫した。３日間それぞれの日に収穫した数について以下のことが分かっている。ア 一昨日は昨日の2倍の数のトマトを収穫した。イ 最も多かった日は最も少なかった日より10個多く収穫した。このとき、今日収穫したトマトの数は何個?", "sub": "", "answer": "2個", "id": 4121}, {"sheet": "SPI(非言語)", "category": "", "question": "P、Q、R、Sの4人の生徒が100m競走をした。同着はなく、順位について以下のことが分かっている。ア Pは1位か2位だった。イ Qは3位か4位だった。このとき、4人の順位について考えられる組み合わせは何通り?", "sub": "", "answer": "8通り", "id": 4122}, {"sheet": "SPI(非言語)", "category": "", "question": "自宅から野球場まで自転車で行くのに、平均時速30km/時で走る予定だったが、実際には平均時速25km/時で走ったので、予定より12分遅れて到着した。このとき、自宅から野球場までの道のりは何km?", "sub": "", "answer": "30km", "id": 4123}, {"sheet": "SPI(非言語)", "category": "", "question": "1房に8本ついたバナナを1房70円で50房仕入れた。1房単位の売値は1房160円で、1本単位の売値は1本30円である。バナナがすべて売り切れ、32本が房単位で売れたとすると、利益はいくらか", "sub": "", "answer": "5940円", "id": 4124}, {"sheet": "SPI(非言語)", "category": "", "question": "X、Y、Zは、-1、0、+1のいずれかであり、同じ数はない。Xは何か ア XとZの和はYに等しい。イ XとYの積はZよりも大きい。", "sub": "", "answer": "C", "id": 4125}, {"sheet": "SPI(非言語)", "category": "", "question": "ある旅行会社のツアーに参加した男性は女性より6人多かった。[問い]このツアーに参加した男性は何人だったか。ア 参加した人数は男女合わせて66人だった。イ参加した男性の人数は女性の人数の1.2倍だった。", "sub": "", "answer": "D", "id": 4126}, {"sheet": "SPI(非言語)", "category": "", "question": "P、Q、Rの3人が1回ずつサイコロを振ったところ、3人が出した目の合計は8だった。[問い]Pが出した目はいくつか。ア PとQは同じ目を出した。イ Pが出した目はRより小さかった。", "sub": "", "answer": "両方でもわからない", "id": 4127}, {"sheet": "SPI(非言語)", "category": "", "question": "バニラ、ストロベリーのアイスクリームが2つずつある。3人で1つずつ食べて1つ余らせるとき、誰が何を食べるかその組み合わせは何通り?", "sub": "", "answer": "6通り", "id": 4128}, {"sheet": "SPI(非言語)", "category": "", "question": "5人の女優の "answer": "30通り", "id": 4140}, {"sheet": "SPI(非言語)", "category": "", "question": "定価2360円の商品を25%の引きで売った時に得られる利益は、定価で売った時の1/3になる。この商品の仕入れ値は何円である", "sub": "", "answer": "1475円", "id": 4141}, {"sheet": "SPI(非言語)", "category": "", "question": "チョコクッキーとミルククッキーの詰め合わせがある。チョコクッキーの割合は何％か？アチョコクッキーの数はミルククッキーの数より８枚多いイチョコクッキーの数は、ミルククッキーの数の1.5倍である", "sub": "", "answer": "イだけ", "id": 4142}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品を定価の20%引きで売ったところ、仕入れ値の12%の利益が得られた。この商品の定価はいくらか？ア定価で売ると、180円の利益が得られる。イ定価の30%引きで売ると9円の損失になる。", "sub": "", "answer": "アだけでもイだけでも", "id": 4143}, {"sheet": "SPI(非言語)", "category": "", "question": "第1章から第5章まである原稿を、順序を変えずに章の区切り方だけを変えて3章にまとめたい。そのまとめ方は？", "sub": "", "answer": "6\nメモ: 4C2", "id": 4144}, {"sheet": "SPI(非言語)", "category": "", "question": "４日間の合計入場者数に占める「子ども」の入場者数の割合は何％である", "sub": "", "answer": "48", "id": 4145}, {"sheet": "SPI(非言語)", "category": "", "question": "1日の入場料の合計が多い順に4日間並べたものはどれ？", "sub": "", "answer": "D(4-1-2-3)", "id": 4146}, {"sheet": "SPI(非言語)", "category": "", "question": "ある学校の図書室では現在98冊の本が貸し出し中になっている。本を借りている人のうち1冊借りている人が17人、2冊借りている人が23人の時、3冊以上借りている人は最も多くて何人？", "sub": "", "answer": "11人", "id": 4147}, {"sheet": "SPI(非言語)", "category": "", "question": "種類の違う4つの花の苗をPとQの2人で2つずつ分ける場合、苗の分け方は何通り", "sub": "", "answer": "6通り", "id": 4148}, {"sheet": "SPI(非言語)", "category": "", "question": "表は、ある年のP,Q,R,S4カ国における牛肉、豚肉、鶏肉の国民1人当たりに対する供給量を示したものである。１最も豚肉の供給量の多い国では、豚肉は牛肉の「」倍 ２各国の鶏肉の供給量が合計供給量に占める割合を表したグラフ", "sub": "", "answer": "１番4.8 2番F（P＜Q＜R＜S）", "id": 4149}, {"sheet": "SPI(非言語)", "category": "", "question": "P、Q、R、Sの4人がそれぞれ品物を持ち寄って、計40品をバザーに寄付した。各自が寄付した品数について、以下のことがわかっている。 アQはPの2倍の品数でRより多かった。イSはQの2倍 Sが寄付した品数は？", "sub": "", "answer": "20品", "id": 4150}, {"sheet": "SPI(非言語)", "category": "", "question": "男女合わせて200人にアンケートを発送した。回収されたアンケートの回答者のうち女性は64人だった。何人の男性にアンケートを発送したか ア女性80％ イ男性60％", "sub": "", "answer": "Aアだけでわかるがイだけではわからない", "id": 4151}, {"sheet": "SPI(非言語)", "category": "", "question": "サイコロを2回振って1回目に出た目の数をｘ、2回目に出た目の数をｙとする。このときｘ≧2ｙになる組み合わせは？", "sub": "", "answer": "9", "id": 4152}, {"sheet": "SPI(非言語)", "category": "", "question": "Pはセール初日に定価の4割引きで服を買い、Qは同じ服をセール最終日に定価の6割引きで、Pより1800円安く買った。この服の定価は？", "sub": "", "answer": "9000円", "id": 4153}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,R,Sの4つのチームがバスケットボールの試合を総当たり方式で行った。ただし、試合に引き分けはなかった。Pは何勝何敗か アQは全勝 イRは全敗", "sub": "", "answer": "E アとイの両方があってもわからない", "id": 4154}, {"sheet": "SPI(非言語)", "category": "", "question": "あるレストランでは、食事のメニューにサラダセット350円かデザートセット480円を付けることができる。エビピラフ「」円にサラダセットを付けた価格はデザートセットの8/9", "sub": "", "answer": "690円", "id": 4155}, {"sheet": "SPI(非言語)", "category": "", "question": "5人の生徒P,Q,R,S,Tが数学のテストを受けた。Pの点数は94点 R,Sの得点はTの2倍 TはQの1.5倍 5人の平均が63点の時ときQは？", "sub": "", "answer": "26点", "id": 4156}, {"sheet": "SPI(非言語)", "category": "", "question": "OK", "sub": "", "answer": "7\nメモ: 類似注意", "id": 4157}, {"sheet": "SPI(非言語)", "category": "", "question": "ある製品を、5個入りまたは8個入りを1セットにして販売した。\n ア 5個入りセットは500円、8個入りセットは700円だった\n イ 売上の合計は6500円だった\nどちらもセットも少なくとも1セットは売れたとする。8個入りは？", "sub": "", "answer": "5\nメモ: 類似注意", "id": 4158}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rは正の整数であり 、以下のことがわかっている。\n ア PxQxR=12 \n イ P÷Q=2\nこのとき、Rは？", "sub": "", "answer": "6", "id": 4159}, {"sheet": "SPI(非言語)", "category": "", "question": "PとQが2回ずつサイコロを振った。2人が出した目について以下のことがわかっている。ア Pが出した目の積は12である イ Pが出した目の和とQが出した目の積は等しい このとき、Qが出した目の和は？", "sub": "", "answer": "6", "id": 4160}, {"sheet": "SPI(非言語)", "category": "", "question": "18㎞ / 時の速さで進むボートで川を下る。川が1m/秒の速さで流れているとき、このボートが180m進むのにかかる時間は？", "sub": "", "answer": "30", "id": 4161}, {"sheet": "SPI(非言語)", "category": "", "question": "今年度の地区センターの利用者数は昨年度より20％、昨年度は一昨年度より15％増えた。このとき、今年度は一昨年度より「」％増えた", "sub": "", "answer": "38", "id": 4162}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】正方形のタイル30枚が横長の長方形の枠内に隙間なく並べて貼られている。ア横に並んでいる枚数は6の倍数ではない イ縦は2の倍数ではない", "sub": "", "answer": "アとイの両方でわかるが、片方では", "id": 4163}, {"sheet": "SPI(非言語)", "category": "", "question": "【疑似注意】ある商品の満足度について、「満足」「ふつう」「不満」の3段階で答えて  4175}, {"sheet": "SPI(非言語)", "category": "", "question": "赤と白と黄と紫のバラをそれぞれ1本以上、合わせて25本買った。どの色のバラを何本買ったか以下がわかっている\n ア：赤の本数は白の本数の２倍 イ：黄は紫の4倍 この時赤の本数は紫のバラの本数の何倍であるか", "sub": "", "answer": "5倍", "id": 4176}, {"sheet": "SPI(非言語)", "category": "", "question": "今年度の地区センター利用者数は昨年度より20%、昨年度は一昨年度より15%増えた。今年度の利用者数は一昨年度より何%増えたか", "sub": "", "answer": "0.38", "id": 4177}, {"sheet": "SPI(非言語)", "category": "", "question": "ある選挙で候補者Xに投票した人のうち女性は40%で、候補者Xに投票した女性は全体の19.4%だった。候補者Xに投票した人は全体の何%か", "sub": "", "answer": "48.5", "id": 4178}, {"sheet": "SPI(非言語)", "category": "", "question": "種類の違う6つの花の苗を、PとQの2人で3つずつ分ける場合、苗の分け方は何通りか", "sub": "", "answer": "20", "id": 4179}, {"sheet": "SPI(非言語)", "category": "", "question": "3本のあたりくじが入った5本のくじがある。5人が順にくじを引き、くじは戻さない。2、3、5番目の人があたりくじを引く確率は", "sub": "", "answer": "1/10", "id": 4180}, {"sheet": "SPI(非言語)", "category": "", "question": "あるサークルの男性と女性の比率3:1。女性が3人加入して2:1。サークルに所属している男性は", "sub": "", "answer": "18", "id": 4181}, {"sheet": "SPI(非言語)", "category": "", "question": "リンゴ、ナシ、カキが17個。ア：リンゴはナシの2倍 イ：ナシはカキより多い カキの数は？", "sub": "", "answer": "2", "id": 4182}, {"sheet": "SPI(非言語)", "category": "", "question": "60人のツアーで、1日目と2日目に4つの観光地P,Q,R,Sのうち1カ所ずつを自由に訪問した。表はその内訳を示したものである。以下の2問に答えてください。１．1日目と2日目に異なる観光地を訪問した人が全体に占める割合 ２．アイウから正しいものは？ ア1日目にQを訪問した人数とRは等しい イ1日目と2日目を合わせてSは14人 ウ1日目にP,2日目にQは全体の20％以上", "sub": "", "answer": "83.3 イだけ", "id": 4183}, {"sheet": "SPI(非言語)", "category": "", "question": "青、白、黒の3色の正方形のタイルを合計9枚使って、同じ色が隣り合わせないように正方形につめた。\nア：青いタイルは白いタイルより2枚多く使った イ：4つの角がすべて同じ色にならないようにした 黒のタイルは何枚？", "sub": "", "answer": "3", "id": 4184}, {"sheet": "SPI(非言語)", "category": "", "question": "x、y、zは-1、0、+1のいずれかの数で同じ数はない。ア：xとzの和はyに等しい イ：xとy積はzよりも大きい", "sub": "", "answer": "アとイの両方でわかるが、片方ではわからない", "id": 4185}, {"sheet": "SPI(非言語)", "category": "", "question": "ある日の午前中、x、y、zが務める事務所に5件の電話があり、3人のいずれかが対応した。xは何件対応したか。\nア：全員が少なくとも1件は対応した イ：xはyと同じ件数対応した", "sub": "", "answer": "アとイの両方があってもわからない", "id": 4186}, {"sheet": "SPI(非言語)", "category": "", "question": "ある月について、以下 疑似注意】ある商品は定価の25％引きで売っても、仕入れ値の5％に当たる90円の利益が得られる。この商品を定価で売ると、［］円の利益が得られる。", "sub": "", "answer": "720円", "id": 4198}, {"sheet": "SPI(非言語)", "category": "", "question": "【疑似注意】ある商品は定価の25％引きで売っても、仕入れ値の5％に当たる90円の利益が得られる。この商品を定価は？", "sub": "", "answer": "2520円", "id": 4199}, {"sheet": "SPI(非言語)", "category": "", "question": "自宅から1.8km離れた駅に行くのに、初めは平均7.2km/時で走ったが、途中から平均時速4.8km/時で歩いたので２０分かかった。この時走った距離は何kmであるか？", "sub": "", "answer": "0.6km", "id": 4200}, {"sheet": "SPI(非言語)", "category": "", "question": "りんご5個、なし4個をPとQで分ける。いずれのフルーツも少なくとも1つは入れて、4個か5個もらえるようにするときその組み合わせは何通りある？", "sub": "", "answer": "6通り", "id": 4201}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,R,S,Tが発表の順番をくじ引きで決める。PがQ,R,Sよりも先に発表することになる確率は何か？", "sub": "", "answer": "1/4", "id": 4202}, {"sheet": "SPI(非言語)", "category": "", "question": "あるコーラスグループのメンバーは男女合わせて60人である。そのうち男性が24人、60歳以上の人が31人であるとき、60歳以上の女性のメンバーは最も少なくて何人であるか？", "sub": "", "answer": "7", "id": 4203}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】東西2地区合同でバスツアーを行ったところ、2地区合わせて75人が参加した。参加した大人と子供の人数について、以下のことがわかっている。 ア大人と子供の参加人数の差は9人だった。 イ子供の参加人数は、東地区が西地区より5人多かった。このとき、大人の参加者数は何人か？", "sub": "", "answer": "42人", "id": 4204}, {"sheet": "SPI(非言語)", "category": "", "question": "映画と美術館のチケット6枚ずつ、遊園地のチケットが12枚あり、X,Y,Zの3人で分けた。3人がもらったチケットの枚数について以下のことがわかっている。 ア映画のチケットはXとYの2人が、美術館のチケットはYだけが、遊園地のチケットはXとZの二人がもらった。イXがもらったチケットの枚数は映画はYの2倍遊園地はZの1/3だった。このときXがもらったチケットは合計で何枚？3", "sub": "", "answer": "7枚", "id": 4205}, {"sheet": "SPI(非言語)", "category": "", "question": "ある博物館の先月の入館者のうち、小学生は45％で、そのうち60％は団体で来ていた。来館者数が2万人だったとすると、団体できた小学生は［］人である。", "sub": "", "answer": "5400", "id": 4206}, {"sheet": "SPI(非言語)", "category": "", "question": "5人の中学生PQRSTの学年について以下のことがわかっている。アPはRより1学年上であるイQとSは同じ学年であるウ2年生は2人である", "sub": "", "answer": "Tは2年生", "id": 4207}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】ある高校の軽音楽部員は3年生が8人、2年生が14人、1年生が11人であり、また男子が15人、女子が18人である。3年生の男子が3人だったとき、2年生の女子は最も多くて［］である。", "sub": "", "answer": "13人\nメモ: 類似注意", "id": 4208}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】ある高校の軽音楽部員は3年生が8人、2年生が14人、1年生が11人であり、また男子が15人、女子が18人である。3年生の男子が3人、2年生の女子が9人だったときの1年生の男子は［］人である。", "sub": "", "answer": "1年生は7人", "id": 4209}, {"sheet": "SPI(非言語)", "category": "", "question": "あるサークルのメンバーは、男性が4人、女性が5人である。この中から代表者として、男性1人、女性2人を選ぶとすると何通り？", "sub": "", "answer": "40通り", "id": 4210}, {"sheet": "SPI(非言語)", "category": "", "question": "XYZの3人が合計１０問の早押しクイズで競った。一番にボタンを押した問題数について以下のことがわかった。アXはYの２倍だった。イZが最も少なかった。このとき、Xが一番にボタンを押した問題数は［］門だった。", "sub": "", "answer": "x=6,y=3,z=1", "id": 4211}, {"sheet": "SPI(非言語)", "category": "", "question": "5つの観光地P,Q,R,S,Tに,3日間にわたって一回ずつ訪れる．一日目と二日目に二カ所ずつ、三日目に一カ所訪れるとすると何日目にどこを訪れるか？その組み合わせ。", "sub": "", "answer": "42分", "id": 4212}, {"sheet": "SPI(非言語)", "category": "", "question": "3つの事業所の従業員のうち、Z事業所の従業員が占める割合は［］％である。", "sub": "", "answer": "0.397", "id": 4213}, {"sheet": "SPI(非言語)", "category": "", "question": "営業職の人数が多い純に事業所を並べたものは、つぎのうちどれか。", "sub": "", "answer": "Z（30）→X（20）→Y（14）", "id": 4214}, {"sheet": "SPI(非言語)", "category": "", "question": "3日間で5つの観光地を一回ずつ訪れる。1日目と２日目に２カ所ずつ、３日目に１カ所訪れるとすると、何日目にどこを訪れるか。その組み合わせは［］通りある。", "sub": "", "answer": "30？", "id": 4215}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人のアルバイトによる4月の収入は32000円だった。ア4月と5月の差は5月と6月と同じ。イ３ヶ月の収入の合計は129000円だった。5月はいくら？", "sub": "", "answer": "43000円", "id": 4216}, {"sheet": "SPI(非言語)", "category": "", "question": "14.4km/時の速さで進むボートで皮を上る。川が２m/秒の速さで流れている時、このボートは60秒間で何m進むか？", "sub": "", "answer": "120m", "id": 4217}, {"sheet": "SPI(非言語)", "category": "", "question": "あるイベントの参加者のうち県外から来た人は何％か？ア県内から来た人は、県外から来た人より2400人多かった。イ県内から来た人数は、県外から来た人の４倍だった。", "sub": "", "answer": "D アだけでも、イだけでもわかる", "id": 4218}, {"sheet": "SPI(非言語)", "category": "", "question": "P、Q、R、Sの4人の生徒が100m競走をした。アPは１位か2位だった。イQは３位か４位だった。この時、4人の順位の組み合わせは？", "sub": "", "answer": "８通り", "id": 4219}, {"sheet": "SPI(非言語)", "category": "", "question": "チョコレート、クッキー、キャンディーの３種類の中から1-3種類が入った詰め合わせが７０袋ある。チョコレート入りが４０袋、クッキー入りが３２袋、キャンディー入りが２６袋で１種類だけ入ったものは４７袋だった。この時３種類とも入った袋は何袋か？", "sub": "", "answer": "５袋", "id": 4220}, {"sheet": "SPI(非言語)", "category": "", "question": "２から８までの数字が1つずつ書かれた７枚のカードがある。この中から３枚のカードを引いた時、3つのカードの和が奇数になる確率は？", "sub": "", "answer": "19/35", "id": 4221}, {"sheet": "SPI(非言語)", "category": "", "question": "２種類のパンと３種類のジャムの中から１種類ずつ選んで朝食に食べる。全く同じパンとジャムの組み合わせを避けて２日間食べるとすると、1日目と2日目に食べるパンとジャムの選び方は？", "sub": "", "answer": "30通り", "id": 4222}, {"sheet": "SPI(非言語)", "category": "", "question": "ある製品を5個入りは１セット500円、8個入りは１セット700円で販売した。ア売れた製品の個数は全部で９０個だった。イ５個入りセットよりも８個入りの方が多く売れた。どちらも１セット売れたとすると売り上げの合計は？", "sub": "", "answer": "8000円", "id": 4223}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品を２５個仕入れ、仕入れ値の４０％増しの価格で売った、いくつか売れ残ってしまい、廃棄したので一個あたり利益は仕入れ値の１２％になった。この時売れた数は？", "sub": "", "answer": "20個", "id": 4224}, {"sheet": "SPI(非言語)", "category": "", "question": "団子を1人４個ずつ配ろうとすると最後の1人が２個しかもらえず、1人に３個ずつ配ると２個余った。団子を分ける人数は？", "sub": "", "answer": "4人", "id": 4225}, {"sheet": "SPI(非言語)", "category": "", "question": "商品Pの価格は商品Qの価格は1.5倍だったが、その後どちらも200円値上がりしたので、商品Pの価格は商品Qの価格の1.4倍になった。現在の商品Pの価格は何円か？", "sub": "", "answer": "1400円", "id": 4226}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rの3つのプロジェクトに各12人、合わせて36人の社員が企画課と営業課から参加している。合わせて36人の社員が企画課と営業課から参加している。アP,Q,Rとも企画課と営業課の社員の人数のさは3人以内である。イ企画課の社員の方が人数が多いのは、Pだけである。P ,Q,Rを合わせると、参加している営業課の社員は最も多くて何人か？", "sub": "", "answer": "19人", "id": 4227}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rの3人が１回ずつサイコロを振ったところ、3人が出した目の合計は13だった。Pが出した目はいくつか？アPが出した目はQの２倍だった。イPが出した目はRより２大きかった", "sub": "", "answer": "アだけ", "id": 4228}, {"sheet": "SPI(非言語)", "category": "", "question": "Pの所持金はQの所持金の1.４倍だったが、その後2人とも1000円ずつ使ったので、Pの所持金はQの所持金の1.５倍になった。現在のPの所持金は何円か？", "sub": "", "answer": "6000円", "id": 4229}, {"sheet": "SPI(非言語)", "category": "", "question": "(類似注意)大人3人、子ども5人を4人ずつ赤組と白組に分ける。いずれの組にも少なくとも1人は大人が入るようにする時、誰がどの組になるか？その組み合わせは？", "sub": "", "answer": "60通り", "id": 4230}, {"sheet": "SPI(非言語)", "category": "", "question": "レジャーランドのアトラクションで、ある団体客を乗り物に3人ずつ乗せるとすると4人が乗れなくなる。4人ずつ乗せるとすると最後の乗り物には、3人が乗り、乗り物が５台余る。この時乗り物は何台か？", "sub": "", "answer": "25台", "id": 4231}, {"sheet": "SPI(非言語)", "category": "", "question": "V,W,X,Y,Zの5人が演習の発表順をくじで決めた。アVはWの次である。イXはYの2人後だが最後ではない。Zの順番は何番？", "sub": "", "answer": "２番目", "id": 4232}, {"sheet": "SPI(非言語)", "category": "", "question": "ある選挙で、候補者Xに投票した人は全体の60.0%で候補者Xに投票した女性は全体の33.3%だった。この時、候補者Xに投票した人のうち女性は何％だった？", "sub": "", "answer": "0.555", "id": 4233}, {"sheet": "SPI(非言語)", "category": "", "question": "赤、白、緑のまんじゅうが２ずつある。X,Y,Zの3人に2つずつ分ける時、誰がどのまんじゅうをいくつもらうか。その組み合わせは？", "sub": "", "answer": "24通り", "id": 4234}, {"sheet": "SPI(非言語)", "category": "", "question": "１週目よりも２週目の冊数が多かった人は最も多くて何人か？", "sub": "", "answer": "17", "id": 4235}, {"sheet": "SPI(非言語)", "category": "", "question": "次のア、イ、ウのうち正しいのは？ア２週目に１冊だった人の１週目の冊数の平均は１.５冊である。イ２週目の合計が２冊だった人が全体に占める割合は20%以上である。ウ１週目も２週目も１冊だった人が１週目に１冊だった人に占める割合は30%以上である。", "sub": "", "answer": "E(アとウ）", "id": 4236}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,R,S,Tが駅で待ち合わせをした。最初に来た人と最後に来た人の到着時刻差のは9分だった。アPとQの到着時刻の差は5分、QとTの差は６分だった。イPとRの到着時刻の差は8分、RとSの差は4分だった。QとSの差は？", "sub": "", "answer": "１分", "id": 4237}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】昨シーズン、ある野球チームの選手の中で、X、YはそれぞれZの6倍、5倍の打点をあげた。XとYの打点の差が7点であったとき、xの打点は何点だった？", "sub": "", "answer": "42点", "id": 4238}, {"sheet": "SPI(非言語)", "category": "", "question": "XとYが1周400mのトラックを12周した。Xは12周するのに14分24秒かかり、Xの平均時速はYより2km/時速かった。このとき、Yは12周するのに[ ]分かかった", "sub": "", "answer": "16分", "id": 4239}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,R,Sの4本のひもがある。長さは純不動で10cm, 20cm, 30cm, 50cmである。どのひもが何cmかについて、以下のことがわかった。ア PとQの長さの和はRの長さと等しい イ QとSの長さの差は10cmである このとき、Pの長さは？cm", "sub": "", "answer": "30cm", "id": 4240}, {"sheet": "SPI(非言語)", "category": "", "question": "W,X,Y,Zの4人が夏休みの前と後に長距離走で順位を競った。夏休み前と比べた夏休み後の順位について、以下のことがわかっている。ただし、同着はなかったものとする。ア Wは順位を2つ上げたが、Yには及ばなかった イ Xの順位は変わらなかった。このとき、夏休み後のZの順位は？", "sub": "", "answer": "4位", "id": 4241}, {"sheet": "SPI(非言語)", "category": "", "question": "水槽に400リットルの水をためるのに水道栓P,Qから同時にそれぞれ毎分8リットルで水を注いだが、途中で水道栓Qが使えなくなり、水をためるのに37分かかった。水道栓Qが使えていた時間は何分？", "sub": "", "answer": "13分", "id": 4242}, {"sheet": "SPI(非言語)", "category": "", "question": "水槽に400リットルの水をためるのに水道栓P,Qから同時にそれぞれ毎分8リットルで水を注いだが、途中で水道栓Qが使えなくなり、水をためるのに35分かかった。水道栓Qが使えていた時間は何分？", "sub": "", "answer": "12分\nメモ: 類似", "id": 4243}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人は英語と数学と国語のテストを受け、3科目の平均点が70点だった。英語の得点は何点か？ア 英語と数学の平均点は70点だった イ英語と国語の平均点は80点だった", "sub": "", "answer": "両方でわかる", "id": 4244}, {"sheet": "SPI(非言語)", "category": "", "question": "赤、白、ロゼの3種のワインを組み合わせて6本購入する。赤、白、ロゼをそれぞれ少なくとも1本は買うとすると、組み合わせ", "sub": "", "answer": "10通り", "id": 4245}, {"sheet": "SPI(非言語)", "category": "", "question": "表中の空欄アは何%?小数点以下第一位を四捨五入", "sub": "", "answer": "1.2", "id": 4246}, {"sheet": "SPI(非言語)", "category": "", "question": "次のア、イ、ウのうち正しいものはどれか。A-Fまでの中から1つ選びなさい。ア 3年目の1年目に対する売上高の増加率は92%である イ 2年目から4年目までの客数合計に占める2年目の割合は30%以下 ウ 4年目の客単いは800円以上", "sub": "", "answer": "イとウの両方", "id": 4247}, {"sheet": "SPI(非言語)", "category": "", "question": "図書館で本とCDを合わせて8点借りた。本は何冊借りた？ア 本はCDより4点多く借りた イ 借りた本の数はCDの数の3倍", "sub": "", "answer": "アだけでも、イだけでもわかる", "id": 4248}, {"sheet": "SPI(非言語)", "category": "", "question": "営業先P,Q,R,Sの4社を月曜日と火曜日に分けて訪問することにした。月曜日に1社または2社訪問する場合、曜日と訪問順の組み合わせは何通り？", "sub": "", "answer": "48通り", "id": 4249}, {"sheet": "SPI(非言語)", "category": "", "question": "キャンディーのつかみ取りで、まずXが全体の3/25を、つぎにYが残りの1/8を、さらにZが残りの1/7をとった。最初キャンディーは100個あった。このとき、残りは何個？", "sub": "", "answer": "66個", "id": 4250}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品の満足度について、「満足」「ふつう」「不満」の3段階で答えてもらった。「満足」と答えた人の割合はどれだけか。ただし、無回答の人はいなかった。ア各回答の割合は、「満足」が「ふつう」の2倍、「ふつう」が「不満」の3倍だった イ各回答の人数は、「満足」が「ふつう」より60人多く、「ふつう」が「不満」より40人多かった", "sub": "", "answer": "アだけでわかるが、イだけではわからない\n➡アとイの両方でわかるが、片方だけではわからない", "id": 4251}, {"sheet": "SPI(非言語)", "category": "", "question": "5人が駅前でチラシを配る。東口で2人、西口で2人、南口で1人が配るとき、誰がどこで配るかの組み合わせは何通り？", "sub": "", "answer": "30通り", "id": 4252}, {"sheet": "SPI(非言語)", "category": "", "question": "りんごとみかんの入った箱から好きなものを２個もらえることになった。りんごとみかんを1個ずつもらった子どもは12人。また、箱の中から減ったみかんは28個。この時、りんごを2個もらった子どもは何人か？", "sub": "", "answer": "10人", "id": 4253}, {"sheet": "SPI(非言語)", "category": "", "question": "月曜日から土曜日までの6日間のうち、塾に2日通うことにした。塾に通う日が連続しないようにすると、塾に通う曜日の組み合わせは何通り？", "sub": "", "answer": "10通り", "id": 4254}, {"sheet": "SPI(非言語)", "category": "", "question": "あるテニスサークルでは、新メンバー125人のうち硬式テニス経験者が56%、軟式テニス経験者が16%で、両方とも経験がある者は8%だった。このとき、いずれも経験がない者は何人？", "sub": "", "answer": "45人", "id": 4255}, {"sheet": "SPI(非言語)", "category": "", "question": "X新聞の購読者200人を対象に調査を行ったところ、Y新聞を購読したことがある人が76人、Z新聞を購読したことがある人が112人、Y、Zどちらの新聞も購読したことがない人が72人だった。このとき、X、Y、Z全ての新聞を購読したことがある人は何人？", "sub": "", "answer": "60人", "id": 4256}, {"sheet": "SPI(非言語)", "category": "", "question": "ある地区のおとなと子どもが2台のバスで旅行に出かけた。子どもの2/5にあたる12人は1台目のバスに乗った。参加した大人と子どもの人数の割合が4:5だったとすると参加した大人の人数", "sub": "", "answer": "24人", "id": 4257}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zの3人が10点満点のテストを受けた。ア平均点は7点で、満点を取った人はいなかった。イXの点数はYの点数より5点高かった。Zの点数は", "sub": "", "answer": "8点", "id": 4258}, {"sheet": "SPI(非言語)", "category": "", "question": "みかんとりんごが合わせて15個ある。みかんを2個食べたところ、残ったみかんの個数がりんごの個数の1.6倍になった。このとき、りんごの個数", "sub": "", "answer": "5個", "id": 4259}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人のアルバイトによる3月の収入は54000円だった。この人の1月から3月までのアルバイト収入について。ア1月と2月の差は2月と3月の差に等しく、収入が同じ月はなかった。イ３ヶ月の収入の平均は43000円だった。1月の収入は", "sub": "", "answer": "32000円", "id": 4260}, {"sheet": "SPI(非言語)", "category": "", "question": "家から郵便局までは時速3.9Km/時で歩くと11分かかる。ある日、急ぎの用事があったので、いつもより3分短い時間で郵便局に着いた。このとき、郵便局までの平均時速は", "sub": "", "answer": "5.4Km/時", "id": 4261}, {"sheet": "SPI(非言語)", "category": "", "question": "1から９までの数字の中から、PとQが好きな数字を1つずつあげた。ア2人があげた数字の和は17である。イ2人があげた数字の差は１である", "sub": "", "answer": "アだけ", "id": 4262}, {"sheet": "SPI(非言語)", "category": "", "question": "発表会でP、Q、R、S、Tの5人が順番にピアノを演奏した。3番目に演奏をしたのは？ア Pの3人後にQが演奏した イ Rの2人後にSが演奏した", "sub": "", "answer": "両方でもわからない", "id": 4263}, {"sheet": "SPI(非言語)", "category": "", "question": "３枚のコインを投げたとき、少なくとも１枚は表が出る確率", "sub": "", "answer": "7/8", "id": 4264}, {"sheet": "SPI(非言語)", "category": "", "question": "おととしの調査に置いて、「大人（女性）」の来店客数は「子ども」の来店客数のちょうど２倍だった。「大人（女性）」の来店客数は", "sub": "", "answer": "13416人", "id": 4265}, {"sheet": "SPI(非言語)", "category": "", "question": "「大人（男性）」、「大人（女性）」、「子ども」のうち、今年の来店客数が昨年の来店客数より増加したものはどれか", "sub": "", "answer": "「大人（男性）」と「大人（女性）」の両方", "id": 4266}, {"sheet": "SPI(非言語)", "category": "", "question": "ある中学校のクラスの生徒40人の中で、夏休みに洋画を行った人が21人、そのうち邦画も観に行った人が8人いた。また、どちらも観に行かなかった人が9人いた。このとき、邦画を観に行った人は［］人である", "sub": "", "answer": "18", "id": 4267}, {"sheet": "SPI(非言語)", "category": "", "question": "インフルエンザを予防するために、「うがい・手洗い」と「マスク」をしているかについて150人に尋ねたところ、「うがい・手洗い」のみの人と「マスク」のみの人の比は4:3、両方している人は54人でどちらもしてない人より、21人多かった。「マスク」のみの人は何人", "sub": "", "answer": "27（マスクのみ）", "id": 4268}, {"sheet": "SPI(非言語)", "category": "", "question": "りんごとみかんが合わせて40個あった。この中からＸはりんごの個数の3/4とみかんの個数の1/3、合わせ20個もらった。このとき、Ｘはみかんを()個もらった", "sub": "", "answer": "8", "id": 4269}, {"sheet": "SPI(非言語)", "category": "", "question": "ある2けたの整数Xについて、以下のことがわかっている。 アXを9で割ると1あまる。イXを11で割ると2あまる このとき、Xを13で割るとあまりは()である。", "sub": "", "answer": "7", "id": 4270}, {"sheet": "SPI(非言語)", "category": "", "question": "PとQは400ｍトラックをスタート地点から反対方向に向かって同時に走った。問い：2人が出会うまでPは何ｍ走ったか。アPとQが同じ速度で走った イPとQは同じ時間走った", "sub": "", "answer": "アだけ", "id": 4271}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zは1から9までの整数のいずれかで、X>Y>Zである。 Yはいくつか。 ア X=4Y イ Z=1/2Y", "sub": "", "answer": "A (アだけでわかるが、イだけではわからない)", "id": 4272}, {"sheet": "SPI(非言語)", "category": "", "question": "(類似注意)大人3人、子ども5人を4人に分ける。いずれの組にも少なくとも1人は大人が入るようにする時、誰がどの組になるか？その組み合わせは？", "sub": "", "answer": "30", "id": 4273}, {"sheet": "SPI(非言語)", "category": "", "question": "箱に赤と白のボールが2:3の割合で入っている。白のボールを4個取り出したところ、残ったボールの赤と白の割合は4:5になった。この箱に入っている赤のボールは何個？", "sub": "", "answer": "16個", "id": 4274}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人が英語と数学と国語のテストを受け、3教科の平均が70点だった。英語の得点は何点？ア 英語と数学の平均点は70点だった イ 英語と国語の平均点は80点だった", "sub": "", "answer": "C両方でわかるが、片方ではわからない", "id": 4275}, {"sheet": "SPI(非言語)", "category": "", "question": "初期投資について、最も高い製品は最も低い製品の何倍？", "sub": "", "answer": "3.4倍\nメモ: 第2位に注意", "id": 4276}, {"sheet": "SPI(非言語)", "category": "", "question": "各製品について、初期投資を回収するまでにかかる時間の見込みを表したグラフは、次のA~Fのうちどれに最も近いか。なお、グラフの横軸は左からP,Q,R,S", "sub": "", "answer": "D. P<Q<R<S", "id": 4277}, {"sheet": "SPI(非言語)", "category": "", "question": "80円のクッキーと50円のチョコレートと10円のキャンディーを組み合わせて200円分にするとき、その組み合わせは何通り？ただし、1つも入らない菓子があっても良い", "sub": "", "answer": "9通り\nメモ: 類似注意", "id": 4278}, {"sheet": "SPI(非言語)", "category": "", "question": "80円のクッキーと50円のチョコレートと10円のキャンディーを組み合わせて300円分にするとき、その組み合わせは何通り？ただし、どの菓子も少なくとも1個は入れる", "sub": "", "answer": "7通り\nメモ: 類似注意", "id": 4279}, {"sheet": "SPI(非言語)", "category": "", "question": "120人にスキーおよびスノーボードをしたことがあるかの質問をしたところ、スキーをしたことがある人が67人、スノーボードをしたことがある人が56人いた。どちらもしたことがない人が30人いたとき、両方ともしたことがある人は？", "sub": "", "answer": "33人", "id": 4280}, {"sheet": "SPI(非言語)", "category": "", "question": "あるクラブのメンバーは3年生が2人、2年生が3人、1年生が1人である。この中から代表者2人をくじで選ぶとき、2人とも同じ学年になる確率は？約分した分数で", "sub": "", "answer": "4/15\nメモ: (2C2+3C2)／6C2", "id": 4281}, {"sheet": "SPI(非言語)", "category": "", "question": "5人のメンバーから2人組を2つ作って卓球のダブルスの試合をするとき、対戦の組み合わせは何通り？", "sub": "", "answer": "15通り\nメモ: (5C2×3C2)／2", "id": 4282}, {"sheet": "SPI(非言語)", "category": "", "question": "ある作品展にXは1つ、Yは2つ、Zは3つの作品を出した。作品は第1会場と第2会場の2カ所に3作品ずつ展示され、場所はくじ引き。Yの2つの作品がともに第1会場に展示される確率は？", "sub": "", "answer": "1/5\nメモ: 4C1／6C3", "id": 4283}, {"sheet": "SPI(非言語)", "category": "", "question": "ボトルに入ったワインを7個のグラスに等分に分けると、6個のグラスに分けた場合に比べて1杯あたりの量が20cc少なくなる。このとき、ボトルに入ってるワイン", "sub": "", "answer": "840cc", "id": 4284}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zは1から9までの整数のいずれかで、X>Y>Zである。ア X=Y+7 イ Z=Y-1", "sub": "", "answer": "A アだけでわかる", "id": 4285}, {"sheet": "SPI(非言語)", "category": "", "question": "縦1.5m横1.8mの長方形の菜園がある。その面積の2/5でトマトを、残りの面積の1/3できゅうりを栽培する。トマトはきゅうりより", "sub": "", "answer": "0.54㎡", "id": 4286}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rの3人で友人のお祝いをすることになり、Pが食事代をQがプレゼント代を支払った。食事代とプレゼント代を３等分することにし、PがQから800円、Rから6600円を受け取って清算した。この時食事代は？", "sub": "", "answer": "14000円", "id": 4287}, {"sheet": "SPI(非言語)", "category": "", "question": "240km先の目的地まで車で走ったところ、途中のX地点までの平均時速は40km/時、X地点から目的地までは60km/時 X地点で1時間休憩した。ア到着するまで6時間 イX地点までの距離は目的地までの距離の半分", "sub": "", "answer": "D アだけでもイだけでもわかる", "id": 4288}, {"sheet": "SPI(非言語)", "category": "", "question": "[類似注意]あるゲームでは0から9までのいずれかの数字を指すルーレットを回し、指した数字の数だけコマを進める。2回ルーレットを回した結果、スタート地点から5つ進んだ位置にコマがある確率", "sub": "", "answer": "1/20", "id": 4289}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】サイコロを2回振って1回目に出た目の数をｘ、2回目に出た目の数をｙとする。このときx+1≧2yになる組み合わせは？", "sub": "", "answer": "12通り", "id": 4290}, {"sheet": "SPI(非言語)", "category": "", "question": "表は,4日間開かれたあるイベントの入場者数をまとめたものである。このイベントの入場料は,「大人」が800円,「子ども」が400円で 1子どもの割合 2入場料の合計が多い順", "sub": "", "answer": "1番48% 2番D4-1-2-3", "id": 4291}, {"sheet": "SPI(非言語)", "category": "", "question": "あるオフィスビルに通勤している150人に、そのビルに入店しているレストランPについて聞いたところ、ランチを食べたことがある人が48人、そのうちディナーも食べたことがある人が23人。両方食べてない人が89人。このときディナーを食べたことのある人は？", "sub": "", "answer": "36人", "id": 4292}, {"sheet": "SPI(非言語)", "category": "", "question": "従業員数の異なるP,Q,R,Sの4社について以下のことがわかっている。アPはQより従業員が多い イRはSより多い 順番の組み合わせは？", "sub": "", "answer": "6通り", "id": 4293}, {"sheet": "SPI(非言語)", "category": "", "question": "1から9までの数字の中から、PとQが好きな数字を１つずつ挙げた。2人が挙げた数字の差は？ ア和は11 イ積は24", "sub": "", "answer": "アとイの両方でわかる", "id": 4294}, {"sheet": "SPI(非言語)", "category": "", "question": "200人を対象に好きなお菓子についてアンケートをとった。スナック菓子が好きな人は全体の65％で、そのうち40%はチョコレート菓子も好きと答えた。いずれも好きじゃない人は18人いた。チョコが好きな人は？", "sub": "", "answer": "104人", "id": 4295}, {"sheet": "SPI(非言語)", "category": "", "question": "100％果汁の液体を水でうすめて果汁37.5％の飲料を作ると、コップにちょうど18杯できる。45％だと？", "sub": "", "answer": "15杯", "id": 4296}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zが同じ店のスタンプカードをもっており、3人で12個のスタンプを集めた。ア3人とも2個以上 イXはZの3倍", "sub": "", "answer": "4個", "id": 4297}, {"sheet": "SPI(非言語)", "category": "", "question": "あるボランティアサークルでは、60歳以上の会員が男女合わせて23人いて、そのうち女性は11人。65歳以上が男女合わせて10人、そのうち女性は6人。60歳以上65歳未満の男性は？", "sub": "", "answer": "8人", "id": 4298}, {"sheet": "SPI(非言語)", "category": "", "question": "２つの整数X,Yがある。XはYより7大きく、Xに10加えた数はYの2倍に等しい。Xは？", "sub": "", "answer": "24", "id": 4299}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人がスタンプラリーに参加し、3日間で18個のスタンプを集めた。ア2日目は3日目の2倍 イ差は7個 3日目は？", "sub": "", "answer": "5個", "id": 4300}, {"sheet": "SPI(非言語)", "category": "", "question": "３本のあたりくじが入ったくじPと、6本のQがある。20人がPを引き、Pに外れた人のみQを引いた。両方外れる確率は？", "sub": "", "answer": "11/20", "id": 4301}, {"sheet": "SPI(非言語)", "category": "", "question": "ある製品を4月に4000個製造し、5月に6000個製造した。この製品の4，5月を合わせた1個あたりの原価が109円で、4月の原価は1個あたり100円", "sub": "", "answer": "115円", "id": 4302}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人がスタンプラリーに参加し、3日間で18個のスタンプを集めた。ア2日目は3日目の2倍 イ差は7個 3日目は？", "sub": "", "answer": "10個", "id": 4303}, {"sheet": "SPI(非言語)", "category": "", "question": "ある地域の住民のうち56％が一戸建て住宅に住み、そのうちの75％は持ち家である。一戸建ての割合は？", "sub": "", "answer": "42％\nメモ: OK", "id": 4304}, {"sheet": "SPI(非言語)", "category": "", "question": "ある電車がP駅からQ駅を通過してR駅まで走った。PQ駅間は平均時速72km/時で10分かかり、PR駅間の時速は？", "sub": "", "answer": "60km/時", "id": 4305}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】PとQがそれぞれの貯金の半分ずつを出し合って車を購入した。Pが出した金額は車の代金のどれだけ？ ア車は300万 イPはQより100万多い", "sub": "", "answer": "Cアとイの両方でわかる", "id": 4306}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zは1から9までの整数のいずれかで、X>Y>Zである。 アX=Y+4 イZ=Y-4 Yは？", "sub": "", "answer": "C アとイの両方でわかる\nメモ: イだけでは複数のパターンが考えられる", "id": 4307}, {"sheet": "SPI(非言語)", "category": "", "question": "表は、ある特急電車のX駅からY駅の料金表 １X駅からY駅までおとな1人と子ども1人で列車Q ２アイウで正しいものは？ アX駅からY駅まで列車P", "sub": "", "answer": "①15870円 ②イだけ(B)", "id": 4308}, {"sheet": "SPI(非言語)", "category": "", "question": "ある団体旅行客91人に集合場所までに利用した交通機関について質問したところ、61人が電車を、33人がバスを利用していた。また、全体の1/7の人は電車もバスも利用していなかった。電車とバスの両方を利用した人は？", "sub": "", "answer": "16人\nメモ: 類似注意！", "id": 4309}, {"sheet": "SPI(非言語)", "category": "", "question": "（類似注意）大人3人と子ども5人が4人ずつの2組に分かれることになった。子どもだけが出来ないようにするとき、8人の分かれ方は", "sub" ": "SPI(非言語)", "category": "", "question": "【類似注意】X,Y,Zの3人が回転寿司店に行き、3人で合計30皿食べた。食べた皿数が1番多かったのはだれ？ アXは13皿食べた イ3人とも5皿以上食べた", "sub": "", "answer": "C", "id": 4323}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】X,Y,Zの3人が回転寿司店に行き、3人で合計30皿食べた。ただし、3人とも1皿以上食べたものとする。食べた皿数が1番多かったのはだれ？ アXは15皿食べた イXはYより6皿、Zより9皿多く食べた", "sub": "", "answer": "D", "id": 4324}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人がX,Y,Zの3教科の模擬試験を受けたところ、Xの点数がYより12点、Zより18点高かった。このとき、Zの点数は3教科の平均より何点低かったか？", "sub": "", "answer": "8", "id": 4325}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】ある本を3日で読み終えた。1日目に全体の40%を2日めに残りの60％。3日目に読んだ量は？", "sub": "", "answer": "24", "id": 4326}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rの3人が1回ずつサイコロを振ったところ、3人が出した目の合計は13だった。アPが出した目はQの２倍 イPが出した目はRより２大きい", "sub": "", "answer": "A", "id": 4327}, {"sheet": "SPI(非言語)", "category": "", "question": "あるレストランでランチを食べた人のうち、サラダを付けた人は52人、デザートを付けた人は28人、サラダを付けた人のうち1/4がデザートも付けた。デザートを付けたがサラダを付けなかった人は？", "sub": "", "answer": "15", "id": 4328}, {"sheet": "SPI(非言語)", "category": "", "question": "100人を対象に、2つの菓子P,Qについて食べたことがあるかどうか調査したところ、Pを食べたことがある人は62人、Qを食べたことがある人は48人。両方とも食べたことある人は最も少なくて何人？", "sub": "", "answer": "10", "id": 4329}, {"sheet": "SPI(非言語)", "category": "", "question": "1. 今年において、3つのイベントの来場者数の合計に占めるイベントPの来場者数の割合は？", "sub": "", "answer": "44", "id": 4330}, {"sheet": "SPI(非言語)", "category": "", "question": "2. 今年と昨年の来場者数を比べたとき、増加率の大きい順に3つのイベントを並べたものはどれか？", "sub": "", "answer": "D", "id": 4331}, {"sheet": "SPI(非言語)", "category": "", "question": "男性5人、女性3人の8人の班の中で、班長と副班長をそれぞれ1名ずつくじ引きで決める。このとき、班長も副班長も男性になる確率は？", "sub": "", "answer": "5/14", "id": 4332}, {"sheet": "SPI(非言語)", "category": "", "question": "図書館でCDを合わせて8点借りた。本を何冊借りたか。ア本はCDより2点多く借りた イ借りた本とCDの数の平均は4", "sub": "", "answer": "A", "id": 4333}, {"sheet": "SPI(非言語)", "category": "", "question": "ある演芸大会で男性3人、女性3人の計6人の中から男女各2人を選んで出し物をすることになった。このとき、出し物をする4人の組み合わせは何通り？", "sub": "", "answer": "9", "id": 4334}, {"sheet": "SPI(非言語)", "category": "", "question": "チョコクッキーとミルククッキーの組み合わせがある。クッキーは合わせて何枚入っているか？ア:チョコクッキーの数はミルクの1.5倍 イ:チョコはミルクより8枚多い", "sub": "", "answer": "C", "id": 4335}, {"sheet": "SPI(非言語)", "category": "", "question": "ある市民講座では受講生の45％が女性で、そのうちの80%が60歳以上である。この講座の受講生で60歳以上の女性の割合は？", "sub": "", "answer": "36", "id": 4336}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】120円,180円,200円の3種類の菓子の詰め合わせについて、以下のことがわかっている。ア詰め合わせの合計金額は980円 イ180円の菓子の数が最も多い このとき、120円の菓子は何個？", "sub": "", "answer": "3\nメモ: 200円のものはおそらく1つと確定できるため、ここで180円のものが2つであると180円の菓子が最も多いという条件に反するために不適当である。よって答えは3個である", "id": 4337}, {"sheet": "SPI(非言語)", "category": "", "question": "【類似注意】120円,180円,200円の3種類の菓子の詰め合わせについて、以下のことがわかっている。ア詰め合わせの合計金額は1300円 イ120円の菓子は180円よりも多い このとき、お菓子は全部で何個？", "sub": "", "answer": "9\nメモ: 120円6個、180円1個、200円2個", "id": 4338}, {"sheet": "SPI(非言語)", "category": "", "question": "120円の菓子と150円の菓子を合わせて35個購入したところ、4650円だった。120円の菓子は150円の菓子より 個多かった。", "sub": "", "answer": "5", "id": 4339}, {"sheet": "SPI(非言語)", "category": "", "question": "ある地区の大人と子どもが2台のバスで旅行に出かけた。子どもの参加者の2/5に当たる12人は1台目のバスに乗った。参加した大人と子どもの人数の割合が4:5とすると、参加した大人の人数は？", "sub": "", "answer": "24", "id": 4340}, {"sheet": "SPI(非言語)", "category": "", "question": "ある部署では、勤続10年以上の人が男女合わせて20人いて、そのうち男性は13人だった。また、勤続15年以上の人が男女合わせて12人いて、そのうち男性は10人だった。このとき、勤続年数が10年以上15年未満の女性は何人？", "sub": "", "answer": "5", "id": 4341}, {"sheet": "SPI(非言語)", "category": "", "question": "あるレストランで食事をした42人のうち、白ワインを飲んだ人は18人、赤ワインを飲んだ人は15人。どちらも飲まなかった人は14人。白ワインと赤ワインの両方を飲んだ人は何人？", "sub": "", "answer": "5", "id": 4342}, {"sheet": "SPI(非言語)", "category": "", "question": "1.12月23日の2500円のケーキの販売個数が、3日間の2500円のケーキの合計販売個数に占める割合は？", "sub": "", "answer": "30", "id": 4343}, {"sheet": "SPI(非言語)", "category": "", "question": "2. つぎのア、イ、ウのうち正しいものはどれか", "sub": "", "answer": "E\nメモ: 3000円の方が大きくなる", "id": 4344}, {"sheet": "SPI(非言語)", "category": "", "question": "あるイベント会場の来場者1200人のうち、会場内で買い物をした人は65%,会場内で食事をした人は18%,買い物も食事もしなかった人は25％だった。このとき、買い物と食事の両方をした人は？", "sub": "", "answer": "96", "id": 4345}, {"sheet": "SPI(非言語)", "category": "", "question": "赤玉が3つと白玉が4つ入った箱から玉を同時に2つ取り出す。このとき、2つとも白玉である確率は？", "sub": "", "answer": "2/7", "id": 4346}, {"sheet": "SPI(非言語)", "category": "", "question": "定価4480円の商品を25%引きで売って、160円の利益を得た。このときの利益は、仕入れ値の何％か", "sub": "", "answer": "5", "id": 4347}, {"sheet": "SPI(非言語)", "category": "", "question": "Xは自宅から2.1km離れた図書館まで、行きは自転車で走り、帰りは自転車を押して歩いた。行きは平均時差10.5km/時で走り、帰りは平均時速4.2km/時で歩いたので、往復するのに 分かかった", "sub": "", "answer": "42", "id": 4348}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人がスタンプラリーに参加し、3日間で30個のスタンプを集めた。各日に集めたスタンプの数は、ア1日目と2日目のスタンプの数の差は2個 イ2日目と3日目のスタンプの数の差は2個 このとき最も多く集めた日のスタンプの数は？", "sub": "", "answer": "12", "id": 4349}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,R,S,T,Uはある小学校の各学年の代表者である。それぞれの学年について、以下のことがわかっている。アPはQより2学年上 イRはPより3学年上 ウSはTより3学年上 このときUは何年生？", "sub": "", "answer": "4", "id": 4350}, {"sheet": "SPI(非言語)", "category": "", "question": "1から9までの数字が1つずつ書かれた9枚のカードをよく切って、X,Y,Zの3人に3枚ずつ配った。配られたカードについて、アYのカードの数字の和は9 イZのカードの数字の和は21 このとき、Xのカードの数字は1と5と〜である", "sub": "", "answer": "9", "id": 4351}, {"sheet": "SPI(非言語)", "category": "", "question": "父の年齢は、この年齢を2倍したものより12歳年上だが、3倍したものより5歳下である。このとき、父の年齢は？", "sub": "", "answer": "46", "id": 4352}, {"sheet": "SPI(非言語)", "category": "", "question": "2つの整数X,Yがある。XはYより7大きく、Xに10を加えた数はYの2倍に等しい。このとき、Xは？", "sub": "", "answer": "24", "id": 4353}, {"sheet": "SPI(非言語)", "category": "", "question": "縦1.5m横1.2mの長方形の紙を使ってポスターを作る。その紙面の3/8をタイトルに、残りの紙面の2/5を日時にあてたい。このとき、タイトルにあてる紙面は日時にあてる紙面の何倍の大きさか", "sub": "", "answer": "1.5", "id": 4354}, {"sheet": "SPI(非言語)", "category": "", "question": "100個のもちを三兄弟でつぎのように分ける。ア三男は可能な限り多くもらう イ三男よりも次男、次男よりも長男のほうが多くもらう このとき、長男は何個もらうか", "sub": "", "answer": "35", "id": 4355}, {"sheet": "SPI(非言語)", "category": "", "question": "ある小学生（6歳〜12歳）の3兄弟P,Q,Rの年齢に関し、以下のことがわかっている ア3人の年齢の和は24 イQはRより5歳年上 このときPの年齢は？", "sub": "", "answer": "7", "id": 4356}, {"sheet": "SPI(非言語)", "category": "", "question": "ある2けたの整数Xについて、以下のことがわかっている。 アXを8で割ると1あまる。イXを11で割ると1あまる このとき、Xを20で割るとあまりは()である。", "sub": "", "answer": "9", "id": 4357}, {"sheet": "SPI(非言語)", "category": "", "question": "取集されたごみの32%が焼却されたところで、当初収集されたごみの28％にあたる量のごみがさらに収集された。このとき、焼却されたごみの量は収集されたごみ全体の何％", "sub": "", "answer": "25％", "id": 4358}, {"sheet": "SPI(非言語)", "category": "", "question": "2個のサイコロを同時に振る。出た目の数の積が偶数になる確率は？", "sub": "", "answer": "3/4", "id": 4359}, {"sheet": "SPI(非言語)", "category": "", "question": "ある音楽教室では春と秋に発表会を開いている。この教室の生徒100人のうち、春の発表会に参加した人は55人、秋の発表会に参加した人は45人だった。[問い]春と秋の両方に参加した人は何人か。 ア秋だけ参加した人は35人 イ春と秋のどちらも参加しなかった人は10人だった", "sub": "", "answer": "D（アだけでも、イだけでも）", "id": 4360}, {"sheet": "SPI(非言語)", "category": "", "question": "ショートケーキ2個とロールケーキ2個、缶コーヒー3本と缶ジュース1本がある。P,Q,R,Sの4人がそれぞれケーキ1個と飲み物1本をもらうとき、誰が何をもらうかの組み合わせは[ ]通りある。", "sub": "", "answer": "24\nメモ: 4C2×4", "id": 4361}, {"sheet": "SPI(非言語)", "category": "", "question": "1から7までの数字が1つずつ書かれたカードが7枚ある。これをよくきって2枚を同時に取り出したとき、2枚のカードに書かれた数字の積が偶数になる確率は", "sub": "", "answer": "5/7\nメモ: 1-(4C2/7C2)", "id": 4362}, {"sheet": "SPI(非言語)", "category": "", "question": "金魚すくいで、XとYが2人合わせて赤い金魚6匹と黒い金魚4匹をとった。2人がとった金魚の数について アXがとった金魚の数はYの2倍以上 イYがとった赤い金魚の火事は黒い金魚のちょうど2倍。このとき、Xがとった赤い金魚の数は", "sub": "", "answer": "４匹", "id": 4363}, {"sheet": "SPI(非言語)", "category": "", "question": "200人を対象に旅行の宿泊施設の好みについてアンケートをとった。旅館が好きな人は全体の65%で、そのうち40%はホテルも好きだった。また、旅館・ホテルのいずれも好きではない人は18人いた。このとき、ホテルが好きな人は[ ]人", "sub": "", "answer": "104人", "id": 4364}, {"sheet": "SPI(非言語)", "category": "", "question": "40人に自家用車についてたずねたところ、普通自動車を所有している人数は軽自動車を所有している人数のちょうど2倍で、そのうち両方を所有している人が5人、またどちらも所有していない人が9人いた。このとき、普通自動車を所有し、軽自動車は所有していない人は", "sub": "", "answer": "19人", "id": 4365}, {"sheet": "SPI(非言語)", "category": "", "question": "ある図書館で、X,Y,Zの3人が合わせて15冊の本を借りた。3人が借りた本の冊数について アXが借りた本の冊数は、Yの2倍以上 イZが借りた本の冊数は、Xの2倍以上、Yの5倍以下だった。 このとき、Zが借りた本は", "sub": "", "answer": "9\nメモ: X=4\nY=2\nZ=9", "id": 4366}, {"sheet": "SPI(非言語)", "category": "", "question": "ある計画についてP,Q,R,Sの4人で話し合い、3人以上が賛成なら実行することにした。[問い]その結果、実行することになった時、Pは賛成したか。\nアPとQの賛否は同じ イRとSの賛否は異なっていた", "sub": "", "answer": "D（アだけでもイだけでも）", "id": 4367}, {"sheet": "SPI(非言語)", "category": "", "question": "P,Q,Rは1から9までの整数のいずれかで、P+Q=15,P+R=14となる。P,Q,Rはいくつか。アP,Q,Rは異なる数である。イPは3つのうちで最も大きい数である。", "sub": "", "answer": "E（両方でもわからない）", "id": 4368}, {"sheet": "SPI(非言語)", "category": "", "question": "男性4人、女性3人の計7人の中から、少なくとも女性1人を含む3人を選んで出し物をすることになった。このとき、出し物をする3人の組み合わせは何通りか", "sub": "", "answer": "31通り", "id": 4369}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zの3人の平均年齢は10歳である。誰が何歳かについて、以下のことがわかっている。アX,Y,Zの順に年長である。イXとYの年齢差はZの年齢に等しい。", "sub": "", "answer": "15歳", "id": 4370}, {"sheet": "SPI(非言語)", "category": "", "question": "XとYが旅行に出掛けた。持参したお金はXがYより12500円多く、どちらも持参したお金の[ ]%ずつ使って土産を買ったので、土産代はXがYとり1500円多くなった。", "sub": "", "answer": "0.12", "id": 4371}, {"sheet": "SPI(非言語)", "category": "", "question": "3つの連続する整数があり、最も小さい数を2乗したものは残りの2つの数の積より23小さい。この時最も小さい数は？", "sub": "", "answer": "7", "id": 4372}, {"sheet": "SPI(非言語)", "category": "", "question": "ある仕事をX、Y、Zの3人で分担した。YはXの1.8倍の量を、ZはXの0.7倍の量を分担した。このとき、Xの仕事量は全体の2/[ ]（分母を答える）", "sub": "", "answer": "7", "id": 4373}, {"sheet": "SPI(非言語)", "category": "", "question": "ある商品を定価の25%引きで売ったところ、仕入れ値の5%にあたる90円の利益が得られた。この商品を定価の30%引きで売ると、[ ]円の損失が出る", "sub": "", "answer": "36円", "id": 4374}, {"sheet": "SPI(非言語)", "category": "", "question": "500ミリリットルのワインを3つのグラスX,Y,Zに注ぎ分けた。最も少ないのはどのワイン。アXにはZより250ミリリットル多く入っている。イXにはZの6倍入っている", "sub": "", "answer": "C（アとイの両方でわかる）\nメモ: X=300,Y=150,Z=50", "id": 4375}, {"sheet": "SPI(非言語)", "category": "", "question": "あるサークルには男性56人，女性75人．ア:男の75%が合宿に参加 イ:女の80%が合宿に参加．参加者は男女どちらが多かったか？", "sub": "", "answer": "B（イだけでわかる）", "id": 4376}, {"sheet": "SPI(非言語)", "category": "", "question": "50円玉が3枚、100円玉が1枚ある。この4枚の硬貨を同時に投げ、表が出たものの金額を足す。金額の合計が150円になる確率", "sub": "", "answer": "1/4", "id": 4377}, {"sheet": "SPI(非言語)", "category": "", "question": "あるデータ入力を8人で行うと、10人で行う場合に比べて1人あたりの入力数が160件増える。このとき、入力するデータの件数は全部で[ ]件である。", "sub": "", "answer": "6400\nメモ: 160×8÷2×10", "id": 4378}, {"sheet": "SPI(非言語)", "category": "", "question": "あるパーティーに参加した男女の人数について、以下のことがわかっている。\n ア パーティーに参加した男女の合計人数は43人だった\n イ 男性の人数は5の倍数で、女性の人数は7の倍数だった\nこのとき、パーティーに参加した女性の人数は？", "sub": "", "answer": "28", "id": 4379}, {"sheet": "SPI(非言語)", "category": "", "question": "ある駅前で、P,Q,R3種類のチラシを配っていた。通行人100人を対象に受け取ったチラシを調べたところ、Pは36人、Qは28人、Rは33人が受け取り、いずれも受け取らなかったのは20人だった。PもQも受け取ったのは8人だったとき、Rだけを受け取ったのは？", "sub": "", "answer": "24", "id": 4380}, {"sheet": "SPI(非言語)", "category": "", "question": "重さの異なるP,Q,R,Sの4つの箱について、以下のことがわかっている。\nア PはSより重い  イ 最も重いのはPではない\nこのとき、4つの箱を重い順に並べると、考えられる順番の組み合わせは[ ]通りである。", "sub": "", "answer": "6", "id": 4381}, {"sheet": "SPI(非言語)", "category": "", "question": "和菓子と洋菓子合わせて80個購入した。和は8個入り，洋は12個入りの箱に入っている。[問い]和菓子の箱は？ただし、和菓子も洋菓子も少なくとも1箱は購入した。\nア 合わせて9箱購入した イ 和菓子の個数の方が洋菓子の個数より多い", "sub": "", "answer": "D アでもイでもわかる\nメモ: 類似注意！", "id": 4382}, {"sheet": "SPI(非言語)", "category": "", "question": "ある家電量販店を訪れた客200人に来店目的を聞いたところ、ゲームを見たいという人が24人、おもちゃを見たいという人が13人、そのどちらでもない人が174人だった。このときゲームとおもちゃのうち、おもちゃだけを見たいという人は〈〉人である。", "sub": "", "answer": "2", "id": 4383}, {"sheet": "SPI(非言語)", "category": "", "question": "1から200までの整数の中に、3の倍数であるが6の倍数ではない整数は〈〉個ある。", "sub": "", "answer": "33\nメモ: 66-33", "id": 4384}, {"sheet": "SPI(非言語)", "category": "", "question": "あるテニスサークルでは、新メンバーのうち硬式テニス経験者が56%、軟式テニス経験者が16%で、両方とも経験がある者は8%だった。このとき、いずれも経験がない者は、新メンバー全体の〈〉％である。", "sub": "", "answer": "36", "id": 4385}, {"sheet": "SPI(非言語)", "category": "", "question": "ある学校の生徒のうち、去年遊園地Xに行った人は136人で、そのうちの3/8は遊園地Yにも行った、また、遊園地Xに行かなかったが、遊園地Yには行った人は64人いた。遊園地Yに行った人のうち2/5はそこで観覧車に乗った。この時、遊園地Yで観覧車に乗った人は何人？", "sub": "", "answer": "46\nメモ: 類似注意！生徒が126人のパターンあり", "id": 4386}, {"sheet": "SPI(非言語)", "category": "", "question": "ある研修会では、3つのセミナーP、Q、Rのうち、1つ以上を受講することになっている。研修生は八十人で、各セミナーの受講人数はPが36人、Qが28人、Rが33人だった。3つとも受講した人がいなかった時、2つのセミナーに受講した人", "sub": "", "answer": "17人", "id": 4387}, {"sheet": "SPI(非言語)", "category": "", "question": "この年の全国の田面積合計は2506千haだった。この時、全国の田面積合計に占めるP、Q、R、S4地域の田面積合計割合", "sub": "", "answer": "0.44", "id": 4388}, {"sheet": "SPI(非言語)", "category": "", "question": "正しいものはどれ？ア aあたりの収穫量について、大きい順", "sub": "", "answer": "【1】7.6％【2】C", "id": 4399}, {"sheet": "SPI(非言語)", "category": "", "question": "図書館で本とCDを合わせて8点借りた。\n【問い】本は何冊借りたか。\n\n ア：本はCDより2点多く借りた\n イ：借りた本とCDの数の平均は4である", "sub": "", "answer": "A", "id": 4400}, {"sheet": "SPI(非言語)", "category": "", "question": "X,Y,Zは1から9までの整数のいずれかでX>Y>Zである。\n【問い】Yはいくつか。\n\n ア：X＝Y＋4\n イ：Z＝Y－4", "sub": "", "answer": "C", "id": 4401}, {"sheet": "SPI(非言語)", "category": "", "question": "家から1.6㎞離れた図書館まで64m/分の速さで歩くと、ちょうど待ち合わせの時刻に着く。このとき、自転車に乗って200m/分の速さで行くと、待ち合わせの\n時刻よりも（   ）早く着く。", "sub": "", "answer": "17分", "id": 4402}, {"sheet": "SPI(非言語)", "category": "", "question": "10㎏の米をX,Y,Zの3人で分けた。\n【問い】Zは何㎏もらったか。\n\n ア：XはYより3㎏多くもらった\n イ：XはYの4倍の量をもらった", "sub": "", "answer": "C", "id": 4403}, {"sheet": "SPI(非言語)", "category": "", "question": "黒、赤、青、緑のボールペンを合わせて28本購入した。各色を購入した本数は全て異なり、その本数について、以下のことがわかっている。\n青は黒より1本少ないとすると、赤は（   ）本である。", "sub": "", "answer": "6", "id": 4404}, {"sheet": "SPI(非言語)", "category": "", "question": "P、Q、R、S、Tの5人が待ち合わせをした。待ち合わせ場所に現れた順番について、以下のことがわかっている。このとき、Tは（   ）番目に来た。", "sub": "", "answer": "2番目\nメモ: 類似注意 481参照", "id": 4405}, {"sheet": "SPI(非言語)", "category": "", "question": "P、Q、Rの3人が、1人5回ずつサッカーのシュートをして、成功した回数を競った。いま、3人が成功した回数について、以下のことがわかっている。Pが成功した回数は？", "sub": "", "answer": "4回", "id": 4406}, {"sheet": "SPI(非言語)", "category": "", "question": "【問い】ある美術館の昨日の来場者数は何人か。\n\n ア：昨日の男性の来場者数は女性より46人多かった\n イ：昨日の女性の来場者数は92人で、全体40％だった", "sub": "", "answer": "B イだけでわかるが、アだけでは", "id": 4407}, {"sheet": "SPI(非言語)", "category": "", "question": "\"X,Y,Zは１から9までの制すのいずれかで、X>Y>Zである。\n【問い】Yはいくつか。\n\n ア：X=Y+4 \n イ：Z=Y-4", "sub": "", "answer": "C", "id": 4408}, {"sheet": "SPI(非言語)", "category": "", "question": "ある高校の生徒420人のうち315人が電車で通学しており、そのうち80％はX電鉄を利用している。このとき、通学にX電鉄を利用している生徒は\n全体の（   ）％である。", "sub": "", "answer": "60", "id": 4409}, {"sheet": "SPI(非言語)", "category": "", "question": "ある人がスタンプラリーに参加し、3日間で18個のスタンプを集めた。各日に集めたスタンプの数について、以下のことがわかっている。\n\n ア：2日目に集めたスタンプの数は3日目の2倍だった\n イ：集めた数が最も多い日と最も少ない日との差は7個だった\n \n const active=new Set();
const PAGE=30;let list=[],shown=0;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hl=(t,q)=>{if(!q)return esc(t);const i=t.indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));};

function renderChips(){
  $('chips').innerHTML='';
  names.forEach(n=>{
    const b=document.createElement('button');b.type='button';b.className='chip';
    b.setAttribute('aria-pressed',active.has(n));
    b.innerHTML=esc(n)+' <small>('+counts[n]+')</small>';
    b.onclick=()=>{active.has(n)?active.delete(n):active.add(n);renderChips();badge();run();};
    $('chips').appendChild(b);
  });
}
function badge(){const b=$('fb');b.hidden=!active.size;b.textContent=active.size+'件選択中';}

function search(raw){
  const q=raw.trim();
  const pool=active.size?DATA.filter(r=>active.has(r.sheet)):DATA;
  if(!q)return active.size?pool.slice():[];
  const a=[],b=[],c=[];
  for(const r of pool){
    if(r.question.startsWith(q)||r.sub.startsWith(q))a.push(r);
    else if(r.question.includes(q)||r.sub.includes(q))b.push(r);
    else if(r.answer.includes(q)||r.category.includes(q))c.push(r);
  }
  return a.concat(b,c);
}
function card(r,q){
  return '<article class="card"><div class="labels"><span class="label">'+esc(r.sheet)+'</span>'+
    (r.category?'<span class="label cat">'+esc(r.category)+'</span>':'')+'</div>'+
    '<p class="q">'+hl(r.question||'（問題文なし）',q)+'</p>'+
    (r.sub?'<p class="subq">'+hl(r.sub,q)+'</p>':'')+
    '<div class="ans"><b class="k">答え</b><div class="v">'+hl(r.answer,q)+'</div></div></article>';
}
function draw(){
  const q=input.value.trim();
  if(!list.length){
    res.innerHTML='<div class="empty"><p>'+(q?'一致する問題が見つかりませんでした。別のキーワードや、問題文のもう少し先の部分で試してください。':'キーワードを入力するか、「種類で絞り込み」から種類を選ぶと問題が表示されます。')+'</p></div>';
    more.hidden=true;return;
  }
  res.innerHTML=list.slice(0,shown).map(r=>card(r,q)).join('');
  more.hidden=shown>=list.length;
}
function run(){
  list=search(input.value);shown=Math.min(PAGE,list.length);
  const q=input.value.trim();
  status.textContent=q?list.length.toLocaleString()+'件ヒットしました':(active.size?list.length.toLocaleString()+'件を一覧表示しています':'全'+DATA.length.toLocaleString()+'問を収録しています');
  draw();
}
let t;input.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(run,120);});
input.addEventListener('compositionend',run);
$('clr').onclick=()=>{input.value='';input.focus();run();};
$('fclr').onclick=()=>{active.clear();renderChips();badge();run();};
more.onclick=()=>{shown=Math.min(shown+PAGE,list.length);draw();};
const top=$('top');
window.addEventListener('scroll',()=>{top.style.display=window.scrollY>600?'block':'none';},{passive:true});
top.onclick=()=>window.scrollTo({top:0});
renderChips();run();
})();}catch(e){document.body.insertAdjacentHTML('afterbegin','<p class="err" role="alert">読み込みエラー：'+String((e&&e.message)||e)+'</p>');}
</script>
</body>
</html>
